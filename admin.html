<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driphouse — Admin Studio</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070b0c;--side:#0b1213;--panel:#10191a;--panel2:#142021;--line:#263638;--mint:#65f2d0;--muted:#8da19f;--white:#f2f7f6;--red:#ff7777;--gold:#e5bd69}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:14px "DM Sans",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:linear-gradient(180deg,#0d1718,#080d0e);border-right:1px solid var(--line);padding:26px 17px;display:flex;flex-direction:column;gap:25px}.logo{font:700 23px "Space Grotesk";letter-spacing:-1.4px;padding:0 10px}.logo span{color:var(--mint)}.side-label{font-size:9px;color:#657977;letter-spacing:.2em;text-transform:uppercase;padding:0 12px;margin-bottom:7px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#9aabaa;text-align:left;padding:13px 14px;border-radius:12px;display:flex;gap:13px;align-items:center;transition:.2s}.nav button:hover{background:#65f2d010;color:var(--mint)}.nav button.active{background:linear-gradient(100deg,#65f2d022,#65f2d00a);color:var(--mint);box-shadow:inset 2px 0 var(--mint)}.nav i{font-style:normal;width:20px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;border:1px solid var(--line);background:#10191a;border-radius:15px;padding:14px;color:var(--muted);font-size:11px;line-height:1.6}.side-bottom b{color:var(--mint);display:block;margin-bottom:4px}
.main{min-width:0;padding:28px 34px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.top h1{font:600 29px "Space Grotesk";letter-spacing:-1px;margin:0}.top p{margin:5px 0 0;color:var(--muted);font-size:12px}.top-right{display:flex;align-items:center;gap:12px}.live{border:1px solid #65f2d033;color:var(--mint);border-radius:99px;padding:9px 13px;font-size:11px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--mint),#157e6d);display:grid;place-items:center;color:#06221b;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:17px}.stat,.panel{background:linear-gradient(150deg,#142021,#0e1718);border:1px solid var(--line);border-radius:17px}.stat{padding:19px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-40px;top:-50px;background:#65f2d012}.stat small{color:var(--muted);font-size:11px}.stat strong{display:block;font:600 28px "Space Grotesk";margin:9px 0 5px}.stat em{font-style:normal;color:var(--mint);font-size:10px}.panel{padding:20px;margin-bottom:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:17px}.panel-head h3{font:600 16px "Space Grotesk";margin:0}.panel-head span{color:var(--muted);font-size:11px}
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}.chart{height:220px;padding:12px 2px 0;border-bottom:1px solid var(--line)}.chart-line{width:100%;height:205px;overflow:visible}.chart-line .gridline{stroke:#304341;stroke-width:1;stroke-dasharray:3 6}.chart-line .sales-line{fill:none;stroke:var(--mint);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #65f2d055)}.chart-line .sales-area{fill:url(#salesFill)}.chart-line .point{fill:var(--mint);stroke:#10201f;stroke-width:3}.chart-labels{display:flex;justify-content:space-between;color:#708481;font-size:9px;padding-top:9px}.payment-list{display:grid;gap:14px}.payrow{display:flex;justify-content:space-between;color:#b6c4c2;font-size:12px}.track{height:5px;background:#253334;border-radius:9px;margin-top:7px;overflow:hidden}.track i{display:block;height:100%;background:var(--mint);border-radius:9px}
table{width:100%;border-collapse:collapse;min-width:620px}th{text-align:left;color:#78908d;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;padding:12px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #26363888;color:#d8e3e1;font-size:12px}tr:last-child td{border-bottom:0}.table-wrap{overflow:auto}.pill{display:inline-block;border-radius:99px;padding:5px 9px;font-size:10px;background:#65f2d018;color:var(--mint)}.pill.warn{background:#e5bd6918;color:var(--gold)}.pill.bad{background:#ff777718;color:var(--red)}
.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--mint);color:#06221b;font-weight:700;font-size:11px;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #65f2d022}.btn.ghost{background:#172324;color:#c2d0ce;border:1px solid var(--line)}.btn.danger{background:#ff777718;color:var(--red);border:1px solid #ff777733}.btn.small{padding:7px 10px}.field{background:#091112;color:var(--white);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;min-width:0}.field:focus{border-color:var(--mint);box-shadow:0 0 0 3px #65f2d012}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar .field{min-width:180px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.form-grid label{display:grid;gap:6px;color:var(--muted);font-size:10px}.form-grid .field{width:100%}.row-actions{display:flex;gap:7px}.empty{padding:25px;text-align:center;color:var(--muted);font-size:12px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 15%,#65f2d018,transparent 45%)}.login-card{width:min(410px,100%);padding:34px;background:#10191a;border:1px solid #65f2d044;border-radius:23px;box-shadow:0 30px 90px #0009}.login-card h1{font:600 29px "Space Grotesk";margin:20px 0 7px}.login-card p{color:var(--muted);font-size:12px;line-height:1.6}.login-card form{display:grid;gap:11px;margin-top:20px}.login-card .field{width:100%}.msg{font-size:11px;color:var(--mint);min-height:17px}.msg.error{color:var(--red)}.hidden{display:none!important}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,25px);opacity:0;transition:.25s;background:var(--mint);color:#06221b;padding:12px 17px;border-radius:99px;font-size:11px;font-weight:700;z-index:99}.toast.on{opacity:1;transform:translate(-50%,0)}
.chat{display:grid;grid-template-columns:260px 1fr;min-height:430px}.threads{border-right:1px solid var(--line);padding-right:12px;overflow:auto}.thread{padding:12px;border-radius:10px;color:#b9c7c5;cursor:pointer;font-size:11px;word-break:break-word}.thread:hover,.thread.active{background:#65f2d014;color:var(--mint)}.conversation{display:flex;flex-direction:column;min-width:0;padding-left:15px}.messages{flex:1;display:flex;flex-direction:column;gap:9px;overflow:auto;max-height:330px;padding:5px}.bubble{max-width:78%;padding:10px 13px;border-radius:13px;background:#1a292a;color:#dce8e6;font-size:12px;line-height:1.5;word-break:break-word}.bubble.staff{align-self:flex-end;background:#65f2d0;color:#06221b}.reply{display:flex;gap:8px;margin-top:12px}.reply .field{flex:1}
@media(max-width:1050px){.shell{grid-template-columns:210px 1fr}.main{padding:24px 20px}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:700px){.shell{grid-template-columns:1fr}.sidebar{padding:12px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}.logo{padding:5px 9px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.side-label,.side-bottom{display:none}.main{padding:20px 14px}.top{align-items:flex-start}.top h1{font-size:24px}.live{display:none}.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:22px}.form-grid{grid-template-columns:1fr 1fr}.chat{grid-template-columns:1fr}.threads{border:0;border-bottom:1px solid var(--line);padding:0 0 10px;display:flex;gap:5px}.thread{min-width:150px}.conversation{padding:12px 0 0}}

.stat strong{letter-spacing:-1px}.panel{box-shadow:0 12px 35px #0002}.main{background:radial-gradient(ellipse at 90% 0%,#65f2d00a,transparent 38%)}.logo{color:#f5fbfa}.side-bottom{border-color:#65f2d033}.top-right .live{background:#65f2d00b}.login-card{position:relative;overflow:hidden}.login-card:before{content:"";position:absolute;width:230px;height:230px;right:-110px;top:-120px;border-radius:50%;background:#65f2d014;filter:blur(10px)}.login-card .logo{position:relative}.login-card .btn{padding:13px}.login-card .field{padding:13px}.form-grid label{font-size:11px}.pill{font-weight:700}
</head><body>
<div id="login" class="login"><div class="login-card"><div class="logo">DRIP<span>HOUSE</span></div><h1>Admin studio.</h1><p>Sign in with an authorised Driphouse administrator account to manage the store.</p><form id="loginForm"><input class="field" type="email" name="email" placeholder="Admin email" required><input class="field" type="password" name="password" placeholder="Password" required><button class="btn">Sign in securely</button><div id="loginMsg" class="msg"></div></form></div></div>
<div id="app" class="shell hidden"><aside class="sidebar"><div class="logo">DRIP<span>HOUSE</span></div><div><div class="side-label">Workspace</div><nav class="nav" id="nav"><button data-view="overview" class="active"><i>◫</i>Overview</button><button data-view="products"><i>◇</i>Products</button><button data-view="orders"><i>▤</i>Orders</button><button data-view="chats"><i>◌</i>Messages</button></nav></div><div class="side-bottom"><b>DRIPHOUSE / CONTROL</b>Store operations and catalogue management.<br>All prices are in EGP.</div><button class="btn ghost" id="logoutBtn">Sign out</button></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Overview</h1><p id="pageSub">A clear view of your store performance.</p></div><div class="top-right"><span class="live">● SYSTEM CONNECTED</span><div class="avatar" id="avatar">D</div></div></div><div id="content"></div></main></div><div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://lmjiujxxzgctlstfbupg.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_wDrf2l81_YbJRa7YYLIzZA_-yvIuOVw';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s),money=n=>'L.E '+Number(n||0).toLocaleString('en-EG',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,view='overview',products=[],orders=[],threads=[],activeThread=null,messages=[];
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('on');setTimeout(()=>$('#toast').classList.remove('on'),2300)}
function msg(id,s,error=false){$(id).textContent=s;$(id).className='msg'+(error?' error':'')}
async function checkAdmin(user){const {data,error}=await db.from('profiles').select('role,full_name').eq('id',user.id).single();if(error||!data||data.role!=='admin')return false;me={...user,...data};return true}
async function loadAll(){const [p,o]=await Promise.all([db.from('products').select('*').order('id',{ascending:false}),db.from('orders').select('*').order('created_at',{ascending:false})]);if(!p.error)products=p.data||[];if(!o.error)orders=o.data||[]}
function showApp(){ $('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#avatar').textContent=(me?.email||'D')[0].toUpperCase();loadAll().then(render)}
function setView(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function render(){const titles={overview:['Overview','A clear view of your store performance.'],products:['Products','Manage your live catalogue and stock.'],orders:['Orders','Review customer orders and update status.'],chats:['Messages','Reply to customer conversations.']};$('#pageTitle').textContent=titles[view][0];$('#pageSub').textContent=titles[view][1];$('#content').innerHTML=({overview:overview,products:productsView,orders:ordersView,chats:chatsView})[view]();if(view==='chats')loadThreads()}
function overview(){let valid=orders.filter(o=>o.status!=='cancelled'),revenue=valid.reduce((s,o)=>s+Number(o.total),0),low=products.filter(p=>Number(p.stock)<=10).length;let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(6-i));let a=+d,b=a+86400000;return valid.filter(o=>{let t=+new Date(o.created_at);return t>=a&&t<b}).reduce((s,o)=>s+Number(o.total),0)}),max=Math.max(...days,1);return `<div class="stats"><div class="stat"><small>Total revenue</small><strong>${money(revenue)}</strong><em>All non-cancelled orders</em></div><div class="stat"><small>Total orders</small><strong>${orders.length}</strong><em>Store orders</em></div><div class="stat"><small>Products</small><strong>${products.length}</strong><em>In catalogue</em></div><div class="stat"><small>Low stock</small><strong>${low}</strong><em>10 units or fewer</em></div></div><div class="grid2"><section class="panel"><div class="panel-head"><h3>Sales performance</h3><span>Last 7 days</span></div><div class="chart"><svg class="chart-line" viewBox="0 0 380 190" role="img" aria-label="Sales over the last seven days"><defs><linearGradient id="salesFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#65f2d0" stop-opacity=".28"/><stop offset="1" stop-color="#65f2d0" stop-opacity="0"/></linearGradient></defs><path class="gridline" d="M18 35H360 M18 82H360 M18 130H360 M18 178H360"/><polygon class="sales-area" points="${area}"/><polyline class="sales-line" points="${points}"/>${days.map((v,i)=>`<circle class="point" cx="${18+i*57}" cy="${178-(v/max*142)}" r="4"><title>${money(v)}</title></circle>`).join('')}</svg></div><div class="chart-labels"><span>6 days ago</span><span>Today</span></div></section><section class="panel"><div class="panel-head"><h3>Inventory watch</h3><span>${low} alerts</span></div>${products.filter(p=>Number(p.stock)<=10).slice(0,6).map(p=>`<div class="payrow"><span>${esc(p.name)}</span><b class="${Number(p.stock)<=0?'':'mint'}">${Number(p.stock)<=0?'Out of stock':p.stock+' left'}</b></div><div class="track"><i style="width:${Math.max(3,Math.min(100,Number(p.stock)*10))}%"></i></div>`).join('')||'<div class="empty">Your inventory is looking healthy.</div>'}</section></div><section class="panel"><div class="panel-head"><h3>Recent orders</h3><button class="btn ghost small" data-goto="orders">View all</button></div>${ordersTable(orders.slice(0,6))}</section>`}
function productsView(){return `<section class="panel"><div class="panel-head"><h3>Add a product</h3><span>New items appear in the shop catalogue</span></div><form id="productForm" class="form-grid"><label>Product name<input class="field" name="name" required></label><label>Category<select class="field" name="category"><option>Pods</option><option>Disposables</option><option>E-liquid</option><option>Coils</option><option>Accessories</option><option>Used Devices</option></select></label><label>Price (L.E)<input class="field" name="price" type="number" min="0" step=".01" required></label><label>Stock<input class="field" name="stock" type="number" min="0" step="1" required></label><label>Discount (%)<input class="field" name="discount_percent" type="number" min="0" max="90" step="1" value="0"></label><label>Image URL<input class="field" name="image_url" type="url" placeholder="https://..."></label><label>Short description<input class="field" name="description" placeholder="Short summary"></label><label>Detail subtitle<input class="field" name="subtitle" placeholder="Short line below product name"></label><label>Full product details<textarea class="field" name="details" rows="3"></textarea></label><label>Specifications (Key: Value per line)<textarea class="field" name="specifications" rows="3" placeholder="Battery: 1000mAh&#10;Power: 30W"></textarea></label><label>Gallery URLs (one per line)<textarea class="field" name="gallery_urls" rows="2"></textarea></label><div style="align-self:end"><button class="btn">Add product</button></div></form></section><section class="panel"><div class="panel-head"><h3>Edit product details</h3><span>Choose a product, update its detail page content, then save</span></div><form id="productDetailsForm" class="form-grid"><label>Product<select class="field" name="product_id" id="detailProductSelect" required><option value="">Choose product</option>${products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>Subtitle<input class="field" name="subtitle"></label><label>Full details<textarea class="field" name="details" rows="3"></textarea></label><label>Specifications JSON<textarea class="field" name="specifications" rows="3" placeholder='{"Battery":"1000mAh","Power":"30W"}'></textarea></label><label>Gallery image URLs (one per line)<textarea class="field" name="gallery_urls" rows="3"></textarea></label><div style="align-self:end"><button class="btn">Save product details</button></div></form></section><section class="panel"><div class="panel-head"><h3>Catalogue</h3><input class="field" id="productSearch" placeholder="Search products…"></div><div class="table-wrap"><table id="productTable"><thead><tr><th>Product</th><th>Category</th><th>Price / Discount</th><th>Stock</th><th>Visibility</th><th>Action</th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td><input class="field" title="Price in L.E" style="width:85px" type="number" step=".01" value="${Number(p.price)||0}" data-edit="${p.id}" data-field="price"><input class="field" title="Discount percent" style="width:65px;margin-left:4px" type="number" min="0" max="90" value="${Number(p.discount_percent)||0}" data-edit="${p.id}" data-field="discount_percent">%</td><td><input class="field" style="width:80px" type="number" value="${Number(p.stock)||0}" data-edit="${p.id}" data-field="stock"></td><td><span class="pill ${Number(p.stock)<=0?'bad':Number(p.stock)<=10?'warn':''}">${Number(p.stock)<=0?'Out of stock':Number(p.stock)<=10?'Low stock':'In stock'}</span></td><td><button class="btn small" data-save-product="${p.id}">Save</button> <button class="btn danger small" data-delete-product="${p.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No products yet.</td></tr>'}</tbody></table></div></section>`}
function ordersTable(list){return `<div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Address</th><th>Date</th></tr></thead><tbody>${list.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.customer_email||o.user_id||'Customer')}<br><small>${esc(o.phone||'')}</small></td><td>${money(o.total)}</td><td>${esc(o.payment_method||'cash')}</td><td><select class="field" data-order-status="${o.id}">${['pending','paid','shipped','cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td>${esc(o.address||'—')}</td><td>${o.created_at?new Date(o.created_at).toLocaleDateString('en-GB'):'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No orders yet.</td></tr>'}</tbody></table></div>`}
function ordersView(){return `<section class="panel"><div class="panel-head"><h3>All orders</h3><span>${orders.length} total</span></div>${ordersTable(orders)}</section>`}
function chatsView(){return `<section class="panel"><div class="panel-head"><h3>Customer messages</h3><button class="btn ghost small" id="refreshChats">Refresh inbox</button></div><div class="chat"><div class="threads" id="threads"><div class="empty">Loading conversations…</div></div><div class="conversation"><div class="messages" id="messages"><div class="empty">Choose a conversation to view messages.</div></div><form class="reply" id="replyForm"><input class="field" name="body" placeholder="Write a reply…" required><button class="btn">Send</button></form></div></div></section>`}
$('#loginForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);msg('#loginMsg','Checking account…');let {data,error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){msg('#loginMsg',error.message,true);return}if(!await checkAdmin(data.user)){await db.auth.signOut();msg('#loginMsg','This account does not have administrator access.',true);return}showApp()};
$('#logoutBtn').onclick=async()=>{await db.auth.signOut();me=null;$('#app').classList.add('hidden');$('#login').classList.remove('hidden')};
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});
$('#content').addEventListener('click',async e=>{let b=e.target.closest('[data-goto]');if(b){setView(b.dataset.goto);return}b=e.target.closest('[data-save-product]');if(b){let id=b.dataset.saveProduct,fields=[...document.querySelectorAll(`[data-edit="${id}"]`)],update={};fields.forEach(x=>update[x.dataset.field]=Number(x.value));let {error}=await db.from('products').update(update).eq('id',id);if(error)return toast(error.message);toast('Product updated');await loadAll();render();return}b=e.target.closest('[data-delete-product]');if(b){if(!confirm('Delete this product?'))return;let {error}=await db.from('products').delete().eq('id',b.dataset.deleteProduct);if(error)return toast(error.message);toast('Product deleted');await loadAll();render()}});
$('#content').addEventListener('submit',async e=>{if(e.target.id==='productDetailsForm'){e.preventDefault();let f=new FormData(e.target),id=f.get('product_id'),specs;try{specs=JSON.parse(f.get('specifications')||'{}')}catch{return toast('Specifications must be valid JSON.')}let update={subtitle:f.get('subtitle')||null,details:f.get('details')||null,specifications:specs,gallery_urls:String(f.get('gallery_urls')||'').split(/\r?\n/).map(v=>v.trim()).filter(Boolean)};let {error}=await db.from('products').update(update).eq('id',id);if(error)return toast(error.message);toast('Product details updated');await loadAll();render();return}if(e.target.id!=='productForm')return;e.preventDefault();let f=new FormData(e.target),specs={};String(f.get('specifications')||'').split(/\r?\n/).forEach(line=>{let i=line.indexOf(':');if(i>0)specs[line.slice(0,i).trim()]=line.slice(i+1).trim()});let row={name:f.get('name').trim(),category:f.get('category'),price:Number(f.get('price')),stock:Number(f.get('stock')),discount_percent:Number(f.get('discount_percent')||0),image_url:f.get('image_url')||null,description:f.get('description')||'',subtitle:f.get('subtitle')||null,details:f.get('details')||null,specifications:specs,gallery_urls:String(f.get('gallery_urls')||'').split(/\r?\n/).map(v=>v.trim()).filter(Boolean)};let {error}=await db.from('products').insert(row);if(error)return toast(error.message);toast('Product added');await loadAll();render()});
$('#content').addEventListener('change',async e=>{if(e.target.id==='detailProductSelect'){let p=products.find(x=>String(x.id)===String(e.target.value)),form=$('#productDetailsForm');if(p){form.elements.subtitle.value=p.subtitle||'';form.elements.details.value=p.details||p.description||'';form.elements.specifications.value=JSON.stringify(p.specifications||{},null,2);form.elements.gallery_urls.value=(p.gallery_urls||[]).join('\n')}return}let x=e.target.closest('[data-order-status]');if(!x)return;let {error}=await db.from('orders').update({status:x.value}).eq('id',x.dataset.orderStatus);if(error){toast(error.message);return}let o=orders.find(o=>String(o.id)===x.dataset.orderStatus);if(o)o.status=x.value;toast('Order status updated')});
$('#content').addEventListener('input',e=>{if(e.target.id!=='productSearch')return;let q=e.target.value.toLowerCase();document.querySelectorAll('#productTable tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')});
async function loadThreads(){let {data,error}=await db.from('support_conversations').select('*').order('last_message_at',{ascending:false});if(error){$('#threads').innerHTML='<div class="empty">Could not load support chats: '+esc(error.message)+'</div>';return}threads=data||[];$('#threads').innerHTML=threads.map(t=>`<div class="thread ${String(activeThread)===String(t.id)?'active':''}" data-thread="${t.id}">${esc(t.visitor_email||'Website visitor')}<br><small>${esc(t.status||'open')}</small></div>`).join('')||'<div class="empty">No customer conversations yet.</div>'}
$('#content').addEventListener('click',async e=>{if(e.target.id==='refreshChats'){loadThreads();return}let t=e.target.closest('[data-thread]');if(!t)return;activeThread=t.dataset.thread;let {data,error}=await db.from('support_messages').select('*').eq('conversation_id',activeThread).order('created_at');if(error){toast(error.message);return}messages=data||[];$('#threads').querySelectorAll('.thread').forEach(x=>x.classList.toggle('active',x===t));drawMessages()});
function drawMessages(){let box=$('#messages');if(!box)return;box.innerHTML=messages.map(m=>`<div class="bubble ${m.sender==='staff'?'staff':''}">${esc(m.body)}</div>`).join('')||'<div class="empty">No messages in this conversation.</div>';box.scrollTop=box.scrollHeight}
$('#content').addEventListener('submit',async e=>{if(e.target.id!=='replyForm')return;e.preventDefault();if(!activeThread)return toast('Choose a conversation first');let body=new FormData(e.target).get('body').trim();if(!body)return;let {data,error}=await db.from('support_messages').insert({conversation_id:activeThread,sender:'staff',body}).select().single();if(error)return toast(error.message);messages.push(data);drawMessages();e.target.reset();await db.from('support_conversations').update({last_message_at:new Date().toISOString()}).eq('id',activeThread);await loadThreads()});
db.auth.getSession().then(async({data})=>{if(data.session?.user&&await checkAdmin(data.session.user))showApp()});
</script></body></html>
