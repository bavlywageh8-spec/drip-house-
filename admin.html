<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Driphouse Admin</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#06100c;--bg2:#0b1a14;--card:#0f2119;--line:#1a3a2b;--ac:#22e58b;--tx:#e9f7ef;--mu:#86a899;--red:#ff5a4f;--gold:#d9a23a;--blue:#4bb8ff}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(700px 500px at 90% 0,#22e58b1a,transparent);pointer-events:none}
a{cursor:pointer}.btn{border:0;border-radius:999px;padding:10px 22px;font:600 13px Poppins;background:var(--ac);color:#03200f;cursor:pointer;transition:transform .15s,box-shadow .25s}.btn:hover{box-shadow:0 6px 24px #22e58b55;transform:translateY(-2px)}.btn:active{transform:scale(.94)}.btn.sm{padding:6px 14px;font-size:12px}.btn.red{background:var(--red);color:#fff}.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
input,select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--tx);font:13px Poppins;margin:6px 0 10px}input:focus,select:focus{outline:2px solid var(--ac)}
.lgn{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative}
.box{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;animation:pop .4s}.box h1{font-size:24px}.box p{color:var(--mu);font-size:13px;margin:6px 0 14px}
.bl{display:block;height:110px;margin:-10px auto 6px;mix-blend-mode:lighten}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(14px)}}
.lr{display:flex;justify-content:space-between;align-items:center;margin:2px 0 16px}.lr a{color:var(--ac);font-size:12px}label.ck{display:flex;gap:8px;align-items:center;color:var(--mu);font-size:12px}label.ck input{width:auto;margin:0}
.msg{font-size:12px;margin-top:10px;color:var(--ac)}.msg.err{color:var(--red)}
#app{display:grid;grid-template-columns:210px 1fr;min-height:100vh;position:relative}
aside{background:var(--bg2);border-inline-end:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside img{height:84px;width:auto;margin:0 auto 10px;mix-blend-mode:lighten}
aside a{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;color:var(--mu);transition:.2s}aside a:hover{color:var(--ac);transform:translateX(3px)}aside a.on{background:var(--card);color:var(--ac);box-shadow:inset 3px 0 var(--ac)}
section.m{padding:0 26px 90px}header{display:flex;align-items:center;gap:14px;padding:18px 0}header h2{font-size:22px;margin-inline-end:auto}header small{color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}
.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;animation:pop .45s both}.panel{margin-bottom:16px;overflow-x:auto}
.stat small{color:var(--mu)}.stat b{display:block;font-size:26px;margin:6px 0}.up{color:var(--ac);font-size:12px}.dn{color:var(--red);font-size:12px}.up i,.dn i{color:var(--mu);font-style:normal}
.g2{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}.g2>.panel,.g3>.panel{margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.ph b{font-size:15px}.ph select{width:auto;margin:0;padding:6px 10px}
#chart{position:relative}#chart svg{width:100%;display:block}#tip{position:absolute;opacity:0;pointer-events:none;transform:translate(-50%,-130%);background:var(--ac);color:#03200f;border-radius:10px;padding:6px 10px;font-size:11px;white-space:nowrap;transition:opacity .15s}#tip b{display:block;font-size:14px}
.donut{position:relative;width:170px;margin:6px auto}.donut svg{width:100%}.donut div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.donut small{color:var(--mu);font-size:11px}.donut b{font-size:18px}
.leg{display:grid;gap:8px;margin-top:12px}.leg div{display:flex;align-items:center;gap:8px;font-size:12px}.leg i{width:10px;height:10px;border-radius:50%}.leg span{margin-inline-start:auto;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mu);font-weight:500;text-align:start}td,th{padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;gap:10px}.row small{color:var(--mu)}
.pill{border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600}.pill.lo{background:#d9a23a33;color:var(--gold)}.pill.zero{background:#ff5a4f33;color:var(--red)}
input.ed,select.ed{background:transparent;border-color:transparent;padding:6px 8px;margin:0;min-width:80px;border-radius:8px}input.ed:hover,select.ed:hover{border-color:var(--line)}input.ed:focus{background:var(--bg2);border-color:var(--ac);outline:0}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}.frm input,.frm select{margin:0}
#savebar{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--ac);border-radius:999px;padding:8px 8px 8px 22px;box-shadow:0 10px 40px #000a;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);z-index:15}#savebar.on{transform:translate(-50%,0)}
.toast{position:fixed;bottom:84px;left:50%;transform:translate(-50%,80px);background:var(--ac);color:#03200f;padding:10px 20px;border-radius:999px;font-weight:600;transition:.35s;z-index:20}.toast.on{transform:translate(-50%,0)}
.achat{display:grid;grid-template-columns:220px 1fr;gap:12px;height:420px}#alist{overflow-y:auto;border-inline-end:1px solid var(--line);padding-inline-end:8px}.th{display:block;padding:9px 10px;border-radius:10px;color:var(--mu);cursor:pointer;margin-bottom:4px;word-break:break-all;font-size:12px}.th.on,.th:hover{background:var(--bg2);color:var(--ac)}
#aconv{display:flex;flex-direction:column;min-width:0}#amsgs{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}.cm{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13px;word-break:break-word}.cm.me{align-self:flex-end;background:var(--ac);color:#03200f}.cm.them{align-self:flex-start;background:var(--bg2)}
#rp{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px}#rp input{margin:0}
@media(max-width:860px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto}aside img{display:none}.g2,.g3,.achat{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<script>
// ===== PUT YOUR SUPABASE PROJECT URL HERE (Project Settings > API) =====
const SB_URL='YOUR_SUPABASE_URL', SB_KEY='sb_publishable_wDrf2l81_YbJRa7YYLIzZA_-yvIuOVw';
// =======================================================================
const live=!SB_URL.startsWith('YOUR'),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const M={cash:'Cash on delivery',card:'Card',wallet:'Mobile wallet'},COL={cash:'#22e58b',card:'#4bb8ff',wallet:'#d9a23a'};
const NAV=[['dash','Dashboard','▦'],['products','Products','◫'],['cats','Categories','☰'],['orders','Orders','✓'],['chats','Support chats','✉'],['staff','Staff','☺']];
let sb,me=null,D={},view='dash',range=7,dirty={p:{},o:{},c:{}},aT=null,aMsgs=[],ch=null;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function lmsg(t,er){$('#lmsg').textContent=t;$('#lmsg').className='msg'+(er?' err':'')}
function client(rm){sb=supabase.createClient(SB_URL,SB_KEY,{auth:{storage:rm?localStorage:sessionStorage,persistSession:true}})}
async function boot(){
  if(!live)return lmsg('Add your Supabase project URL in admin.html (see the top of the script).',1);
  client(localStorage.getItem('rm')!=='0');
  sb.auth.onAuthStateChange(async ev=>{if(ev==='PASSWORD_RECOVERY'){const p=prompt('Type your new password (6+ characters)');if(p&&p.length>=6){const r=await sb.auth.updateUser({password:p});toast(r.error?r.error.message:'Password updated')}}});
  const{data:{session}}=await sb.auth.getSession();if(session)enter(session.user)}
async function enter(u){
  const{data}=await sb.from('profiles').select('role').eq('id',u.id).single();
  if(data?.role!=='admin'){await sb.auth.signOut();return lmsg('This account is not an admin.',1)}
  me={id:u.id,email:u.email};$('#login').hidden=true;$('#app').hidden=false;$('#me').textContent=u.email;
  await loadAll();render();ch?.unsubscribe();
  ch=sb.channel('admin-chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},p=>{if(p.new.thread_id==aT){if(!aMsgs.find(x=>x.id===p.new.id)){aMsgs.push(p.new);drawA()}}else{loadThreads()}}).subscribe()}
async function loadAll(){
  const [p,o,i,pr,c,th,sm]=await Promise.all([sb.from('products').select('*').order('id'),sb.from('orders').select('*').order('id',{ascending:false}),sb.from('order_items').select('*'),sb.from('profiles').select('*'),sb.from('categories').select('*').order('name'),sb.from('chat_threads').select('*').order('last_message_at',{ascending:false}),sb.from('chat_messages').select('staff_id').eq('sender','staff')]);
  D={products:p.data||[],orders:o.data||[],items:i.data||[],profiles:pr.data||[],cats:c.data||[],threads:th.data||[],staffMsgs:sm.data||[]}}
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));
  if(f.id==='lf'){if(!live)return lmsg('Add your Supabase project URL first.',1);localStorage.setItem('rm',v.rm?'1':'0');client(!!v.rm);
    const{data,error}=await sb.auth.signInWithPassword({email:v.email,password:v.pw});if(error)return lmsg(error.message,1);lmsg('');enter(data.user)}
  if(f.id==='pf'){const r=await sb.from('products').insert({...v,price:+v.price,stock:+v.stock});if(r.error)return toast(r.error.message);await loadAll();toast('Product added');render()}
  if(f.id==='cf'){const r=await sb.from('categories').insert({name:v.name.trim()});if(r.error)return toast(r.error.message);await loadAll();toast('Category added');render()}
  if(f.id==='sf'){const r=await sb.from('profiles').update({role:'admin'}).eq('email',v.email.trim()).select();if(r.error)return toast(r.error.message);if(!r.data.length)return toast('No account with that email. Ask them to sign up on the shop first.');await loadAll();toast('Admin added');render()}
  if(f.id==='rp')sendReply(v.m),f.reset()});
$('#fp').onclick=async()=>{const em=$('#lf [name=email]').value;if(!em)return lmsg('Type your email first.',1);if(!live)return;const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});lmsg(r.error?r.error.message:'Reset link sent. Check your inbox.',!!r.error)};
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
document.addEventListener('click',async e=>{const t=e.target;let d;
  if(d=t.closest('[data-nav]')){view=d.dataset.nav;render()}
  else if(t.closest('[data-save]'))saveAll();
  else if(d=t.closest('[data-delp]')){if(confirm('Delete this product?')){await sb.from('products').delete().eq('id',d.dataset.delp);await loadAll();render()}}
  else if(d=t.closest('[data-delc]')){if(confirm('Delete this category? Products keep their current category name.')){await sb.from('categories').delete().eq('id',d.dataset.delc);await loadAll();render()}}
  else if(d=t.closest('[data-rma]')){if(confirm('Remove admin access for this account?')){await sb.from('profiles').update({role:'customer'}).eq('id',d.dataset.rma);await loadAll();render()}}
  else if(d=t.closest('[data-th]')){openTh(d.dataset.th)}});
function track(e){const t=e.target;if(t.id==='rng'){range=+t.value;return drawChart()}if(!t.classList.contains('ed'))return;
  const v=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?null:+t.value):t.value;(dirty[t.dataset.k][t.dataset.id]??={})[t.dataset.f]=v;bar()}
document.addEventListener('input',track);document.addEventListener('change',track);
const nd=()=>Object.keys(dirty.p).length+Object.keys(dirty.o).length+Object.keys(dirty.c).length;
function bar(){$('#savebar').classList.toggle('on',nd()>0);$('#savecount').textContent=nd()+' unsaved change'+(nd()>1?'s':'')}
async function saveAll(){const b=$('[data-save]');b.disabled=true;b.textContent='Saving...';let err=null;
  for(const[id,v]of Object.entries(dirty.p)){const r=await sb.from('products').update(v).eq('id',id);if(r.error)err=r.error;else Object.assign(D.products.find(x=>x.id==id),v)}
  for(const[id,v]of Object.entries(dirty.o)){const u={...v};if('status'in v)u.handled_by=me.id;const r=await sb.from('orders').update(u).eq('id',id);if(r.error)err=r.error;else Object.assign(D.orders.find(x=>x.id==id),u)}
  for(const[id,v]of Object.entries(dirty.c)){const c=D.cats.find(x=>x.id==id),nm=(v.name||'').trim();if(!nm)continue;const r=await sb.from('categories').update({name:nm}).eq('id',id);if(r.error){err=r.error;continue}await sb.from('products').update({category:nm}).eq('category',c.name);D.products.forEach(p=>{if(p.category===c.name)p.category=nm});c.name=nm}
  b.disabled=false;b.textContent='Save changes';if(err)return toast('Could not save: '+err.message);dirty={p:{},o:{},c:{}};bar();toast('Saved')}
const ed=(k,o,f,type='text',w='')=>`<input class="ed" type="${type}" ${type==='number'?'step="any"':''} value="${esc(o[f])}" data-k="${k}" data-id="${o.id}" data-f="${f}" style="${w}">`;
const catOpts=sel=>[...new Set([...D.cats.map(c=>c.name),sel])].filter(Boolean).map(n=>`<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('');
const cust=id=>D.profiles.find(p=>p.id===id)?.email||'Guest';
const V={};
const badge=(c,p)=>{const x=p?(c-p)/p*100:(c?100:0);return `<span class="${x>=0?'up':'dn'}">${x>=0?'▲':'▼'} ${Math.abs(x).toFixed(1)}% <i>vs previous 7 days</i></span>`};
V.dash=()=>{
  const ok=D.orders.filter(o=>o.status!=='cancelled'),now=Date.now(),W=864e5,sum=l=>l.reduce((s,o)=>s+Number(o.total),0);
  const win=(l,a,b)=>l.filter(o=>{const t=+new Date(o.created_at);return t>=now-a*W&&t<now-b*W});
  const cs=D.profiles.filter(p=>p.role==='customer'),stat=(l,v,c,p)=>`<div class="stat"><small>${l}</small><b>${v}</b>${badge(c,p)}</div>`;
  const tot=sum(ok),C=2*Math.PI*60;let acc=0;
  const segs=Object.keys(M).map(k=>({k,v:sum(ok.filter(o=>(o.payment_method||'cash')===k))}));
  const circ=segs.map(s=>{const len=tot?s.v/tot*C:0,c=`<circle cx="80" cy="80" r="60" fill="none" stroke="${COL[s.k]}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)"/>`;acc+=len;return c}).join('');
  const st={};D.orders.forEach(o=>st[o.id]=o.status);const top={};
  D.items.filter(i=>st[i.order_id]&&st[i.order_id]!=='cancelled').forEach(i=>{const k=i.product_id||i.name;const r=top[k]??={name:i.name,q:0,rev:0,pid:i.product_id};r.q+=i.qty;r.rev+=i.qty*i.price});
  const tl=Object.values(top).sort((a,b)=>b.rev-a.rev).slice(0,5);
  const low=[...D.products].filter(p=>p.stock<=10).sort((a,b)=>a.stock-b.stock).slice(0,6);
  const staff=D.profiles.filter(p=>p.role==='admin').map(p=>{const os=D.orders.filter(o=>o.handled_by===p.id);return{e:p.email,n:os.length,s:sum(os),m:D.staffMsgs.filter(x=>x.staff_id===p.id).length}});
  return `<div class="stats">${stat('Total sales',money(tot),sum(win(ok,7,0)),sum(win(ok,14,7)))}${stat('Total orders',D.orders.length,win(D.orders,7,0).length,win(D.orders,14,7).length)}${stat('Customers',cs.length,cs.filter(p=>+new Date(p.created_at)>now-7*W).length,cs.filter(p=>{const t=+new Date(p.created_at);return t>now-14*W&&t<=now-7*W}).length)}</div>
  <div class="g2" style="margin-bottom:16px"><div class="panel"><div class="ph"><b>Sales performance</b><select id="rng"><option value="7" ${range==7?'selected':''}>Last 7 days</option><option value="30" ${range==30?'selected':''}>Last 30 days</option></select></div><div id="chart"></div></div>
  <div class="panel"><div class="ph"><b>Payment methods</b></div><div class="donut"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="60" fill="none" stroke="#1a3a2b" stroke-width="18"/>${circ}</svg><div><small>Total</small><b>${money(tot)}</b></div></div><div class="leg">${segs.map(s=>`<div><i style="background:${COL[s.k]}"></i>${M[s.k]}<span>${money(s.v)}</span></div>`).join('')}</div></div></div>
  <div class="g3"><div class="panel"><div class="ph"><b>Top selling products</b></div><table><tr><th>Product</th><th>Sold</th><th>Revenue</th><th>Stock</th></tr>${tl.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.q}</td><td>${money(p.rev)}</td><td>${D.products.find(x=>x.id===p.pid)?.stock??'-'}</td></tr>`).join('')||'<tr><td colspan=4 style="color:var(--mu)">No sales yet.</td></tr>'}</table></div>
  <div><div class="panel"><div class="ph"><b>Inventory alerts</b></div>${low.map(p=>`<div class="row"><span>${esc(p.name)}</span><span class="pill ${p.stock<=0?'zero':'lo'}">${p.stock<=0?'Out':p.stock+' left'}</span></div>`).join('')||'<small style="color:var(--mu)">All products are well stocked.</small>'}</div>
  <div class="panel"><div class="ph"><b>Employee performance</b></div>${staff.map(s=>`<div class="row"><span>${esc(s.e)}<br><small>${s.n} orders, ${s.m} chat replies</small></span><b>${money(s.s)}</b></div>`).join('')}</div></div></div>`};
function drawChart(){const box=$('#chart');if(!box)return;
  const ok=D.orders.filter(o=>o.status!=='cancelled'),n=range,vals=[],labs=[];
  for(let i=n-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const a=+d,b=a+864e5;vals.push(ok.filter(o=>{const t=+new Date(o.created_at);return t>=a&&t<b}).reduce((s,o)=>s+Number(o.total),0));labs.push(d.toLocaleDateString(undefined,{month:'short',day:'numeric'}))}
  const W=620,H=230,l=44,r=12,t=14,b=26,mx=Math.max(...vals,1),X=i=>l+i*(W-l-r)/(n-1),Y=v=>H-b-v/mx*(H-t-b),pts=vals.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${l}" x2="${W-r}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="#1a3a2b"/><text x="${l-6}" y="${Y(mx*f)+4}" text-anchor="end" fill="#86a899" font-size="10">${Math.round(mx*f)}</text>`).join('');
  const xl=labs.map((s,i)=>i%Math.ceil(n/7)===0?`<text x="${X(i)}" y="${H-8}" text-anchor="middle" fill="#86a899" font-size="10">${s}</text>`:'').join('');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22e58b" stop-opacity=".45"/><stop offset="1" stop-color="#22e58b" stop-opacity="0"/></linearGradient></defs>${grid}${xl}<polygon points="${X(0)},${H-b} ${pts} ${X(n-1)},${H-b}" fill="url(#g)"/><polyline points="${pts}" fill="none" stroke="#22e58b" stroke-width="2.5" stroke-linejoin="round"/><line id="cl" y1="${t}" y2="${H-b}" stroke="#22e58b" stroke-dasharray="4" opacity="0"/><circle id="cd" r="5" fill="#22e58b" opacity="0"/></svg><div id="tip"></div>`;
  box.onmousemove=e=>{const rc=box.getBoundingClientRect(),rx=(e.clientX-rc.left)/rc.width*W,i=Math.max(0,Math.min(n-1,Math.round((rx-l)/((W-l-r)/(n-1)))));
    const cl=$('#cl'),cd=$('#cd'),tip=$('#tip');cl.setAttribute('x1',X(i));cl.setAttribute('x2',X(i));cl.setAttribute('opacity',1);cd.setAttribute('cx',X(i));cd.setAttribute('cy',Y(vals[i]));cd.setAttribute('opacity',1);
    tip.style.cssText=`opacity:1;left:${X(i)/W*100}%;top:${Y(vals[i])/H*100}%`;tip.innerHTML=`${labs[i]}<b>${money(vals[i])}</b>`};
  box.onmouseleave=()=>{$('#cl').setAttribute('opacity',0);$('#cd').setAttribute('opacity',0);$('#tip').style.opacity=0}}
V.products=()=>`<div class="panel"><div class="ph"><b>Add product</b></div><form id="pf" class="frm"><input name="name" placeholder="Name" required><select name="category">${catOpts('')}</select><input name="price" type="number" step="0.01" placeholder="Price" required><input name="stock" type="number" placeholder="Stock" required><input name="image_url" placeholder="Image URL (optional)"><input name="description" placeholder="Description"><button class="btn sm">Add product</button></form></div>
<div class="panel"><div class="ph"><b>Products</b><small style="color:var(--mu)">Click any cell to edit, then press Save changes.</small></div><table><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Description</th><th>Image URL</th><th>New</th><th></th></tr>${D.products.map(p=>`<tr><td>${ed('p',p,'name')}</td><td><select class="ed" data-k="p" data-id="${p.id}" data-f="category">${catOpts(p.category)}</select></td><td>${ed('p',p,'price','number','width:80px')}</td><td>${ed('p',p,'stock','number','width:70px')}</td><td>${ed('p',p,'description')}</td><td>${ed('p',p,'image_url')}</td><td><input type="checkbox" class="ed" data-k="p" data-id="${p.id}" data-f="is_new" ${p.is_new?'checked':''} style="width:auto;margin:0"></td><td><button class="btn red sm" data-delp="${p.id}">Delete</button></td></tr>`).join('')}</table></div>`;
V.cats=()=>`<div class="panel"><div class="ph"><b>Add category</b></div><form id="cf" class="frm"><input name="name" placeholder="Category name" required><button class="btn sm">Add category</button></form></div>
<div class="panel"><div class="ph"><b>Categories</b><small style="color:var(--mu)">Renaming also updates the products in it.</small></div><table><tr><th>Name</th><th>Products</th><th></th></tr>${D.cats.map(c=>`<tr><td>${ed('c',c,'name')}</td><td>${D.products.filter(p=>p.category===c.name).length}</td><td><button class="btn red sm" data-delc="${c.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan=3 style="color:var(--mu)">No categories yet.</td></tr>'}</table></div>`;
V.orders=()=>`<div class="panel"><div class="ph"><b>Orders</b></div><table><tr><th>#</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Address</th><th>Date</th></tr>${D.orders.map(o=>`<tr><td>${o.id}</td><td>${esc(cust(o.user_id))}</td><td>${money(o.total)}</td><td>${M[o.payment_method]||'Cash on delivery'}</td><td><select class="ed" data-k="o" data-id="${o.id}" data-f="status">${['pending','paid','shipped','cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td>${ed('o',o,'address')}</td><td>${new Date(o.created_at).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan=7 style="color:var(--mu)">No orders yet.</td></tr>'}</table></div>`;
V.chats=()=>`<div class="panel"><div class="achat"><div id="alist"></div><div id="aconv"><div id="amsgs"></div><form id="rp"><input name="m" placeholder="Reply to customer" autocomplete="off" required><button class="btn sm">Send</button></form></div></div></div>`;
V.staff=()=>`<div class="panel"><div class="ph"><b>Add an admin</b></div><form id="sf" class="frm"><input name="email" type="email" placeholder="Email of an existing account" required><button class="btn sm">Make admin</button></form><p style="color:var(--mu);font-size:12px;margin-top:10px">The person must first sign up on the shop. Only admins can do this.</p></div>
<div class="panel"><div class="ph"><b>Admins</b></div><table><tr><th>Email</th><th>Name</th><th></th></tr>${D.profiles.filter(p=>p.role==='admin').map(p=>`<tr><td>${esc(p.email)}</td><td>${esc(p.full_name||'')}</td><td>${p.id===me.id?'<small style="color:var(--mu)">You</small>':`<button class="btn red sm" data-rma="${p.id}">Remove</button>`}</td></tr>`).join('')}</table></div>`;
function render(){const n=NAV.find(x=>x[0]===view);$('#title').textContent=n[1];$('#nav').innerHTML=NAV.map(x=>`<a data-nav="${x[0]}" class="${x[0]===view?'on':''}"><span>${x[2]}</span>${x[1]}</a>`).join('');
  $('#main').innerHTML=V[view]();if(view==='dash')drawChart();if(view==='chats'){loadThreads();drawA()};bar()}
async function loadThreads(){const{data}=await sb.from('chat_threads').select('*').order('last_message_at',{ascending:false});D.threads=data||[];const l=$('#alist');if(l)l.innerHTML=D.threads.map(h=>`<a class="th ${aT==h.id?'on':''}" data-th="${h.id}">${esc(h.customer_email||'Customer')}</a>`).join('')||'<small style="color:var(--mu)">No chats yet.</small>'}
async function openTh(id){aT=id;const{data}=await sb.from('chat_messages').select('*').eq('thread_id',id).order('id');aMsgs=data||[];drawA();loadThreads()}
function drawA(){const b=$('#amsgs');if(!b)return;b.innerHTML=aMsgs.map(m=>`<div class="cm ${m.sender==='staff'?'me':'them'}">${esc(m.body)}</div>`).join('')||'<small style="color:var(--mu)">Pick a chat on the left.</small>';b.scrollTop=b.scrollHeight}
async function sendReply(body){body=(body||'').trim();if(!body||!aT)return toast('Pick a chat first');
  const{data,error}=await sb.from('chat_messages').insert({thread_id:aT,sender:'staff',body}).select().single();if(error)return toast(error.message);
  if(!aMsgs.find(x=>x.id===data.id)){aMsgs.push(data);drawA()}
  sb.from('chat_threads').update({last_message_at:new Date().toISOString()}).eq('id',aT)}
boot();
