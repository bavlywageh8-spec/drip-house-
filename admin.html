<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Driphouse Admin</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#070a0b;--bg2:#0c1213;--card:#0f1819;--card2:#132022;--line:#1d2e3073;--line2:#1d2e30;--ac:#19e6c1;--ac2:#0fa88c;--tx:#e8f6f4;--mu:#8aa9a8;--red:#ff5a4f;--gold:#d9a23a;--blue:#4bb8ff;--vio:#8a6bff}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font-family:Poppins,system-ui,sans-serif;background:#030506;color:var(--tx);font-size:13.5px}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(700px 500px at 90% 0,#19e6c114,transparent),radial-gradient(600px 500px at 0 100%,#8a6bff10,transparent);pointer-events:none}
a{cursor:pointer}.btn{border:0;border-radius:999px;padding:10px 22px;font:600 13px Poppins;background:var(--ac);color:#04201b;cursor:pointer;transition:transform .15s,box-shadow .25s}.btn:hover{box-shadow:0 6px 24px #19e6c155}.btn:active{transform:scale(.94)}.btn.sm{padding:6px 14px;font-size:12px}.btn.red{background:#ff5a4f22;color:var(--red);border:1px solid #ff5a4f55}.btn.red:hover{background:var(--red);color:#fff}.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line2)}
input,select{width:100%;background:#0a1112;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;color:var(--tx);font:13px Poppins;margin:6px 0 10px}input:focus,select:focus{outline:2px solid var(--ac)}
select option{background:#0f1819}
.lgn{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative}
.box{width:min(400px,100%);background:linear-gradient(160deg,#0f2118,#0c1213);border:1px solid var(--line2);border-radius:26px;padding:30px;animation:pop .4s;box-shadow:0 30px 80px #000a}.box h1{font-size:24px}.box p{color:var(--mu);font-size:13px;margin:6px 0 14px}
.bl{display:block;height:110px;margin:-10px auto 6px;mix-blend-mode:lighten}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(14px)}}
.lr{display:flex;justify-content:space-between;align-items:center;margin:2px 0 16px}.lr a{color:var(--ac);font-size:12px}label.ck{display:flex;gap:8px;align-items:center;color:var(--mu);font-size:12px}label.ck input{width:auto;margin:0}
.msg{font-size:12px;margin-top:10px;color:var(--ac)}.msg.err{color:var(--red)}
/* app shell: a rounded floating dashboard, icon rail on the left */
#app{display:grid;grid-template-columns:236px 1fr;gap:0;min-height:100vh;position:relative;max-width:1500px;margin:0 auto;padding:14px}
#app>aside,#app>section.m{background:linear-gradient(180deg,#0a1112,#070a0b);border:1px solid var(--line2)}
aside{border-radius:26px 0 0 26px;border-inline-end:0;padding:18px 12px;position:sticky;top:14px;height:calc(100vh - 28px);display:flex;flex-direction:column;align-items:stretch;gap:6px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:2px 6px 18px}.brand img{height:46px;width:auto;mix-blend-mode:lighten;flex:none}.brand b{display:block;font-size:19px;font-weight:700;line-height:1.1}.brand small{display:block;color:var(--mu);font-size:11.5px;margin-top:2px}
#nav{display:flex;flex-direction:column;gap:6px;align-items:stretch}
aside a{position:relative;display:flex;align-items:center;gap:14px;height:46px;padding:0 16px;border-radius:15px;color:var(--mu);transition:.2s;font-weight:500;font-size:14px;white-space:nowrap}aside a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

aside a:hover{color:var(--ac);background:#19e6c112}aside a.on{background:linear-gradient(135deg,#19e6c1,#0fa88c);color:#04201b;box-shadow:0 8px 24px #19e6c144;font-weight:600}
section.m{border-radius:0 26px 26px 0;padding:0 24px 90px;min-width:0}
header{display:flex;align-items:center;gap:12px;padding:16px 0 14px}header h2{font-size:21px;margin-inline-end:auto;font-weight:600}header small{color:var(--mu)}
.srch{display:flex;align-items:center;gap:8px;background:#0a1112;border:1px solid var(--line2);border-radius:999px;padding:0 14px;height:40px;width:min(300px,34vw)}.srch svg{width:16px;height:16px;fill:none;stroke:var(--mu);stroke-width:2;stroke-linecap:round}.srch input{border:0;background:none;margin:0;padding:0;height:100%}.srch input:focus{outline:0}
.av{display:flex;align-items:center;gap:10px;background:#0a1112;border:1px solid var(--line2);border-radius:999px;padding:4px 14px 4px 4px}.av i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#19e6c1,#4bb8ff);display:grid;place-items:center;color:#04201b;font:700 13px Poppins;font-style:normal}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:14px}
.stat,.panel{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:20px;padding:18px;animation:pop .45s both}.panel{margin-bottom:14px;overflow-x:auto}
.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(#19e6c122,transparent 70%)}
.stat .ico{width:34px;height:34px;border-radius:11px;background:#19e6c11a;color:var(--ac);display:grid;place-items:center;margin-bottom:10px}.stat .ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat small{color:var(--mu)}.stat b{display:block;font-size:27px;margin:4px 0 6px;font-weight:600;letter-spacing:-.5px}.up,.dn{font-size:11.5px;display:inline-flex;gap:6px;align-items:center}.up{color:var(--ac)}.dn{color:var(--red)}.up i,.dn i{color:var(--mu);font-style:normal}
.g2{display:grid;grid-template-columns:1.7fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:1.7fr 1fr;gap:14px}.g2>.panel,.g3>.panel{margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.ph b{font-size:15px;font-weight:600}.ph select{width:auto;margin:0;padding:6px 12px;border-radius:999px}
.lgd{display:flex;gap:14px;font-size:11px;color:var(--mu);margin-bottom:6px}.lgd i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px}
#chart{position:relative}#chart svg{width:100%;display:block}#tip{position:absolute;opacity:0;pointer-events:none;transform:translate(-50%,-135%);background:#fff;color:#04140c;border-radius:10px;padding:6px 11px;font-size:11px;white-space:nowrap;transition:opacity .15s;box-shadow:0 8px 24px #000a}#tip b{display:block;font-size:14px}
.donut{position:relative;width:190px;margin:4px auto}.donut svg{width:100%}.donut div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.donut small{color:var(--mu);font-size:11px}.donut b{font-size:20px;font-weight:600}
.leg{display:grid;gap:8px;margin-top:12px}.leg div{display:flex;align-items:center;gap:8px;font-size:12px}.leg i{width:10px;height:10px;border-radius:50%}.leg span{margin-inline-start:auto;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mu);font-weight:500;text-align:start;font-size:12px}td,th{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border-bottom:0}
.pn{display:flex;align-items:center;gap:10px}.pn i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:700 12px Poppins;font-style:normal;color:#04201b}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;gap:10px}.row:last-child{border-bottom:0}.row small{color:var(--mu)}
.pill{border-radius:999px;padding:3px 11px;font-size:11px;font-weight:600}.pill.lo{background:#d9a23a26;color:var(--gold)}.pill.zero{background:#ff5a4f26;color:var(--red)}
input.ed,select.ed{background:transparent;border-color:transparent;padding:6px 8px;margin:0;min-width:80px;border-radius:8px}input.ed:hover,select.ed:hover{border-color:var(--line2)}input.ed:focus{background:#0a1112;border-color:var(--ac);outline:0}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}.frm input,.frm select{margin:0}
#savebar{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);display:flex;gap:16px;align-items:center;background:var(--card2);border:1px solid var(--ac);border-radius:999px;padding:8px 8px 8px 22px;box-shadow:0 10px 40px #000a;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);z-index:15}#savebar.on{transform:translate(-50%,0)}
.toast{position:fixed;bottom:84px;left:50%;transform:translate(-50%,80px);background:var(--ac);color:#04201b;padding:10px 20px;border-radius:999px;font-weight:600;transition:.35s;z-index:20;opacity:0;pointer-events:none}.toast.on{transform:translate(-50%,0);opacity:1}
.achat{display:grid;grid-template-columns:220px 1fr;gap:12px;height:420px}#alist{overflow-y:auto;border-inline-end:1px solid var(--line2);padding-inline-end:8px}.th{display:block;padding:9px 10px;border-radius:10px;color:var(--mu);cursor:pointer;margin-bottom:4px;word-break:break-all;font-size:12px}.th.on,.th:hover{background:#0a1112;color:var(--ac)}
#aconv{display:flex;flex-direction:column;min-width:0}#amsgs{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}.cm{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13px;word-break:break-word}.cm.me{align-self:flex-end;background:var(--ac);color:#04201b}.cm.them{align-self:flex-start;background:#0a1112}
#rp{display:flex;gap:8px;border-top:1px solid var(--line2);padding-top:10px}#rp input{margin:0}
@media(max-width:860px){#app{grid-template-columns:1fr;padding:8px}aside{position:static;height:auto;flex-direction:row;border-radius:22px 22px 0 0;overflow-x:auto;padding:10px}.brand{display:none}#nav{flex-direction:row}aside a{padding:0 14px;height:42px;font-size:13px}section.m{border-radius:0 0 22px 22px;padding:0 14px 90px}.g2,.g3,.achat{grid-template-columns:1fr}.srch{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ===== login: the picture is the background, the live card sits exactly on its card ===== */
:root{--gd:#19e6c1;--gd3:#0fa88c}
.lgn{position:relative;min-height:100vh;overflow:hidden;background:#04050a;display:block;padding:0}
.lstage{position:absolute;left:50%;top:50%;width:max(100vw,calc(100vh*1.7768));aspect-ratio:1672/941;transform:translate(-50%,-50%);background-size:100% 100%;background-repeat:no-repeat;container-type:inline-size}
.lgn .box{position:absolute;left:52.3%;top:13.6%;width:41.4%;height:77.7%;max-width:none;margin:0;padding:0;border-radius:2.3cqw;background:linear-gradient(180deg,#0c0c11,#050508);border:.2cqw solid #19e6c1;box-shadow:0 0 2.2cqw #19e6c188,inset 0 0 3cqw #19e6c114;animation:none}
.lgn .box>*{position:absolute}
.crest{left:50%;top:-12.9%;width:33.8%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:#050508;border:.2cqw solid #19e6c1;box-shadow:0 0 1.8cqw #19e6c199;display:grid;place-items:center;overflow:hidden}.crest img{width:94%;mix-blend-mode:lighten}
.lgn .box .t{left:0;right:0;top:20.4%;text-align:center;font-size:2.65cqw;font-weight:500;line-height:1.2}.t span{color:var(--gd);font-weight:600}
.lgn .box .st{left:0;right:0;top:29.2%;text-align:center;font-size:1.3cqw;color:#dfe3ee;margin:0}
.fld{left:8.9%;width:82.9%;height:9.4%}.f1{top:36.5%}.f2{top:48.8%}
.fld>svg{position:absolute;left:2.2cqw;top:50%;transform:translateY(-50%);width:2cqw;height:2cqw;fill:none;stroke:#eef0f6;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;z-index:1;pointer-events:none}
.lgn .fld input{width:100%;height:100%;margin:0;padding:0 5cqw 0 5.6cqw;border-radius:1.25cqw;background:#07090f;border:.1cqw solid #8a93ab;color:#fff;font-size:1.4cqw}.lgn .fld input:focus{outline:0;border-color:var(--gd);box-shadow:0 0 1cqw #19e6c166}
.eye{position:absolute;right:1.6cqw;top:50%;transform:translateY(-50%);background:none;border:0;color:#c6cad8;cursor:pointer;display:grid;padding:0}.eye svg{width:2cqw;height:2cqw;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lgn .lr{left:8.9%;right:8.9%;top:60.2%;height:5.6%;margin:0;display:flex;justify-content:space-between;align-items:center}
.lgn .lr a{color:var(--gd);font-size:1.35cqw;font-weight:500}.lgn label.ck{color:#fff;font-size:1.35cqw;gap:.8cqw}.lgn label.ck input{width:1.6cqw;height:1.6cqw;accent-color:var(--gd);margin:0}
.btn.gold{left:8.9%;width:82.9%;top:69.7%;height:9.8%;padding:0;display:flex;align-items:center;justify-content:center;gap:.9cqw;font-size:1.75cqw;color:#04201b;background:linear-gradient(180deg,#8ff7e6,#19e6c1 55%,#0fa88c);box-shadow:0 0 1.5cqw #19e6c177,inset 0 .1cqw 0 #fff8}.btn.gold:hover{box-shadow:0 0 2.4cqw #19e6c1cc,inset 0 .1cqw 0 #fff8}
.btn.gold svg,.btn.back svg{width:2cqw;height:2cqw;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.or{left:8.9%;width:82.9%;top:81.6%;height:4.2%;display:flex;align-items:center;gap:1.2cqw;color:#e5e7ef;font-size:1.3cqw}.or:before,.or:after{content:"";flex:1;height:1px;background:#4a5370}
.btn.back{left:8.9%;width:82.9%;top:87.4%;height:7.8%;padding:0;display:flex;align-items:center;justify-content:center;gap:.8cqw;background:transparent;color:#fff;border:.1cqw solid #c8cddc;text-decoration:none;font-size:1.45cqw;font-weight:400}.btn.back:hover{background:#ffffff0d;box-shadow:none}.btn.back svg{stroke:var(--gd)}
.lgn .msg{left:0;right:0;top:101.5%;text-align:center;margin:0;font-size:1.2cqw}
.btn:hover{transform:none!important}
@media(max-width:860px){
.lgn .lstage{position:relative;left:auto;top:auto;transform:none;width:100%;aspect-ratio:auto;min-height:100vh;min-height:100dvh;background-size:cover;background-position:18% 50%;container-type:normal;display:flex;align-items:center;justify-content:center;padding:76px 16px 28px}
.lgn .lstage:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#04050acc,#04050a66 45%,#04050acc)}
.lgn .lstage .box{position:relative;left:auto;top:auto;width:100%;max-width:380px;height:auto;padding:62px 20px 22px;border-radius:24px;border-width:2px;background:#07070bf2;box-shadow:0 0 28px #19e6c166;display:flex;flex-direction:column}
.lgn .lstage .box>*{position:relative;left:auto;right:auto;top:auto;width:auto;height:auto}
.lgn .lstage .box>.crest{position:absolute;left:50%;top:-46px;width:92px;height:92px;transform:translateX(-50%);border-width:3px}
.lgn .lstage .box>.t{font-size:23px;margin:0;line-height:1.25}
.lgn .lstage .box>.st{font-size:13px;margin:4px 0 18px}
.lgn .lstage .box>.fld{width:100%;height:50px;margin:0 0 12px}
.lgn .lstage .box .fld>svg{left:16px;width:20px;height:20px}
.lgn .lstage .box .fld input{padding:0 46px 0 48px;font-size:16px;border-radius:14px}
.lgn .lstage .box .eye{right:12px}.lgn .lstage .box .eye svg{width:20px;height:20px}
.lgn .lstage .box>.lr{display:flex;width:100%;margin:4px 0 16px}
.lgn .lstage .box>.lr a,.lgn .lstage .box>.lr label.ck{font-size:13px}.lgn .lstage .box>.lr label.ck{gap:8px}.lgn .lstage .box>.lr label.ck input{width:17px;height:17px}
.lgn .lstage .box>.btn.gold{display:flex;width:100%;height:50px;font-size:16px;gap:8px}
.lgn .lstage .box>.btn.back{display:flex;width:100%;height:48px;font-size:15px;gap:8px}
.lgn .lstage .box>.btn.gold svg,.lgn .lstage .box>.btn.back svg{width:20px;height:20px}
.lgn .lstage .box>.or{width:100%;margin:14px 0;font-size:12px;gap:12px}
.lgn .lstage .box>.msg{margin:12px 0 0;font-size:12px}
}
@media(max-width:860px) and (max-height:620px){.lgn .lstage{align-items:flex-start;padding-top:70px}}
/* stop browsers painting autofill yellow */
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px #07090f inset!important;box-shadow:0 0 0 1000px #07090f inset!important;-webkit-text-fill-color:#fff!important;caret-color:#fff;transition:background-color 99999s}

.sbadge{border-radius:999px;padding:3px 11px;font-size:11px;font-weight:600;background:#19e6c126;color:var(--ac)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ic2{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ic2 b{font-size:14.5px;font-weight:600}.ic2 img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:#0a1112}.ic2 img.wide{aspect-ratio:16/7}
.ic2 small{color:var(--mu);line-height:1.5}.ic2 .acts{display:flex;gap:8px;margin-top:auto}
.note{color:var(--mu);font-size:12px;margin:0 0 12px;line-height:1.6}.note code{color:var(--ac)}
.warn{background:#ff5a4f14;border:1px solid #ff5a4f55;color:#ffb3ad;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.6}
select.ed{min-width:125px}

.fl{display:grid;gap:4px;color:var(--mu);font-size:12px}.fl input{margin:0;padding:9px 12px;font-size:12px}

function drawChart(){const box=$('#chart');if(!box)return;
  const ok=D.orders.filter(o=>o.status!=='cancelled'),n=range,vals=[],labs=[];
  for(let i=n-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const a=+d,b=a+864e5;vals.push(ok.filter(o=>{const t=+new Date(o.created_at);return t>=a&&t<b}).reduce((s,o)=>s+Number(o.total),0));labs.push(d.toLocaleDateString(undefined,{month:'short',day:'numeric'}))}
  const W=620,H=230,l=44,r=12,t=14,b=26,mx=Math.max(...vals,1),X=i=>l+i*(W-l-r)/(n-1),Y=v=>H-b-v/mx*(H-t-b),pts=vals.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');const cnt=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const s=+d;cnt.push(ok.filter(o=>{const t=+new Date(o.created_at);return t>=s&&t<s+864e5}).length)}const cm=Math.max(...cnt,1),pts2=cnt.map((v,i)=>`${X(i)},${Y(v/cm*mx*.8)}`).join(' ');
  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${l}" x2="${W-r}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="#1d2e30"/><text x="${l-6}" y="${Y(mx*f)+4}" text-anchor="end" fill="#8aa9a8" font-size="10">${Math.round(mx*f)}</text>`).join('');
  const xl=labs.map((s,i)=>i%Math.ceil(n/7)===0?`<text x="${X(i)}" y="${H-8}" text-anchor="middle" fill="#8aa9a8" font-size="10">${s}</text>`:'').join('');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19e6c1" stop-opacity=".45"/><stop offset="1" stop-color="#19e6c1" stop-opacity="0"/></linearGradient></defs>${grid}${xl}<polygon points="${X(0)},${H-b} ${pts} ${X(n-1)},${H-b}" fill="url(#g)"/><polyline points="${pts2}" fill="none" stroke="#8a6bff" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 4" opacity=".9"/><polyline points="${pts}" fill="none" stroke="#19e6c1" stroke-width="2.5" stroke-linejoin="round"/><line id="cl" y1="${t}" y2="${H-b}" stroke="#19e6c1" stroke-dasharray="4" opacity="0"/><circle id="cd" r="5" fill="#19e6c1" opacity="0"/></svg><div id="tip"></div>`;
  box.onmousemove=e=>{const rc=box.getBoundingClientRect(),rx=(e.clientX-rc.left)/rc.width*W,i=Math.max(0,Math.min(n-1,Math.round((rx-l)/((W-l-r)/(n-1)))));
    const cl=$('#cl'),cd=$('#cd'),tip=$('#tip');cl.setAttribute('x1',X(i));cl.setAttribute('x2',X(i));cl.setAttribute('opacity',1);cd.setAttribute('cx',X(i));cd.setAttribute('cy',Y(vals[i]));cd.setAttribute('opacity',1);
    tip.style.cssText=`opacity:1;left:${X(i)/W*100}%;top:${Y(vals[i])/H*100}%`;tip.innerHTML=`${labs[i]}<b>${money(vals[i])}</b>`};
  box.onmouseleave=()=>{$('#cl').setAttribute('opacity',0);$('#cd').setAttribute('opacity',0);$('#tip').style.opacity=0}}

V.repairs=()=>{const R=D.repairs,cnt=s=>R.filter(r=>r.status===s).length,rev=R.filter(r=>r.status==='delivered').reduce((s,r)=>s+Number(r.price)-Number(r.discount||0),0);
  return need('repairs')+`<div class="stats"><div class="stat"><small>In progress</small><b>${cnt('received')+cnt('diagnosing')+cnt('repairing')}</b></div><div class="stat"><small>Ready for pickup</small><b>${cnt('ready')}</b></div><div class="stat"><small>Delivered</small><b>${cnt('delivered')}</b></div><div class="stat"><small>Repair income</small><b>${money(rev)}</b></div></div>
<div class="panel"><div class="ph"><b>New repair</b></div><form id="rpf" class="frm"><input name="customer" placeholder="Customer name" required><input name="phone" placeholder="Phone"><input name="device" placeholder="Device" required><input name="issue" placeholder="What is wrong?"><input name="price" type="number" step="0.01" placeholder="Price (ج.م)"><input name="discount" type="number" step="0.01" min="0" placeholder="Discount (optional)"><label class="fl"><span>Photo of the device (optional)</span><input name="image" type="file" accept="image/*"></label><select name="status">${RST.map(s=>`<option>${s}</option>`).join('')}</select><button class="btn sm">Add repair</button></form></div>
<div class="panel"><div class="ph"><b>Repairs</b><small style="color:var(--mu)">Click any cell to edit, then press Save changes.</small></div><table><tr><th>#</th><th>Customer</th><th>Phone</th><th>Device</th><th>Photo</th><th>Issue</th><th>Price</th><th>Discount</th><th>Total</th><th>Status</th><th>Notes</th><th>Date</th><th></th></tr>${R.map(r=>`<tr><td>${r.id}</td><td>${ed('r',r,'customer')}</td><td>${ed('r',r,'phone')}</td><td>${ed('r',r,'device')}</td><td>${r.image_url?`<a href="${esc(r.image_url)}" target="_blank"><img class="rimg" src="${esc(r.image_url)}" alt=""></a>`:''}<label class="btn ghost sm" style="cursor:pointer">${r.image_url?'Change':'Add photo'}<input type="file" accept="image/*" data-rup="${r.id}" hidden></label></td><td>${ed('r',r,'issue')}</td><td>${ed('r',r,'price','number','width:80px')}</td><td>${ed('r',r,'discount','number','width:80px')}</td><td><b>${money(Number(r.price)-Number(r.discount||0))}</b></td><td>${sel('r',r,'status',RST)}</td><td>${ed('r',r,'notes')}</td><td>${new Date(r.created_at).toLocaleDateString()}</td><td><button class="btn red sm" data-delr="${r.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan=13 style="color:var(--mu)">No repairs yet.</td></tr>'}</table></div>`};
V.promos=()=>need('discounts')+`<div class="panel"><div class="ph"><b>New discount code</b></div><p class="note">Customers type the code in their cart. <b>Percent</b> takes a % off the total, <b>fixed</b> takes a fixed amount off. Minimum total and end date are optional.</p><form id="df" class="frm"><input name="code" placeholder="Code (e.g. WELCOME10)" required><select name="kind"><option value="percent">percent</option><option value="fixed">fixed</option></select><input name="value" type="number" step="0.01" min="0.01" placeholder="Value" required><input name="min_total" type="number" step="0.01" placeholder="Minimum total"><input name="ends_at" type="date" title="End date"><button class="btn sm">Add discount</button></form></div>
<div class="panel"><div class="ph"><b>Discount codes</b><small style="color:var(--mu)">Click any cell to edit, then press Save changes.</small></div><table><tr><th>Code</th><th>Type</th><th>Value</th><th>Min total</th><th>Ends</th><th>Active</th><th></th></tr>${D.discounts.map(x=>`<tr><td>${ed('d',x,'code')}</td><td>${sel('d',x,'kind',['percent','fixed'])}</td><td>${ed('d',x,'value','number','width:80px')}</td><td>${ed('d',x,'min_total','number','width:90px')}</td><td><input class="ed" type="date" value="${esc(x.ends_at||'')}" data-k="d" data-id="${x.id}" data-f="ends_at"></td><td><input type="checkbox" class="ed" data-k="d" data-id="${x.id}" data-f="active" ${x.active?'checked':''} style="width:auto;margin:0"></td><td><button class="btn red sm" data-deld="${x.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan=7 style="color:var(--mu)">No discount codes yet.</td></tr>'}</table></div>`;
const SLOTS=[['hero','Main image at the top of the shop','Wide photo, about 1600 x 700. The title sits on the left, so keep that side calm.',1],['disposables','Disposables banner','4:3 banner.'],['pods','Pods banner','4:3 banner.'],['premium','E-liquid banner','4:3 banner.'],['used','Used Devices banner','4:3 banner.'],['accessories','Accessories banner','4:3 banner.'],['coils','Coils banner','4:3 banner.']];
V.images=()=>need('imgs')+`<p class="note">These pictures appear on the shop home page. Pick a new photo and it is live straight away. <b>Use default</b> brings the original back.</p><div class="imgs">${SLOTS.map(([k,t,d,w])=>`<div class="ic2"><b>${t}</b><img class="${w?'wide':''}" src="${esc(D.imgs[k]||DEF[k])}" alt=""><small>${D.imgs[k]?'Custom image.':'Default image.'} ${d}</small><div class="acts"><label class="btn sm" style="cursor:pointer">Change image<input type="file" accept="image/*" data-up="${k}" hidden></label>${D.imgs[k]?`<button class="btn ghost sm" data-imgreset="${k}">Use default</button>`:''}</div></div>`).join('')}</div>`;
async function upImg(file,folder){const blob=await shrink(file,900),path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';const up=await sb.storage.from('shop-images').upload(path,blob,{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;return sb.storage.from('shop-images').getPublicUrl(path).data.publicUrl}
function shrink(file,max){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const s=Math.min(1,max/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('Could not read the image')),'image/jpeg',.86)};im.onerror=()=>no(new Error('Could not read the image'));im.src=u})}
document.addEventListener('change',async e=>{const i=e.target;if(!i.matches||!i.matches('input[type=file][data-up]')||!i.files[0])return;const k=i.dataset.up;toast('Uploading...');
  try{const blob=await shrink(i.files[0],k==='hero'?1800:900),path=k+'-'+Date.now()+'.jpg';
    const up=await sb.storage.from('shop-images').upload(path,blob,{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;
    const url=sb.storage.from('shop-images').getPublicUrl(path).data.publicUrl;
    const r=await sb.from('site_images').upsert({key:k,url,updated_at:new Date().toISOString()});if(r.error)throw r.error;
    await loadAll();toast('Image updated');render()}catch(er){toast('Upload failed: '+(er.message||er))}});
document.addEventListener('change',async e=>{const i=e.target;if(!i.matches||!i.matches('input[type=file][data-rup]')||!i.files[0])return;toast('Uploading...');try{const url=await upImg(i.files[0],'repairs');const r=await sb.from('repairs').update({image_url:url}).eq('id',i.dataset.rup);if(r.error)throw r.error;await loadAll();toast('Photo updated');render()}catch(er){toast('Upload failed: '+(er.message||er))}});
function render(){const n=NAV.find(x=>x[0]===view);$('#title').textContent=n[1];$('#nav').innerHTML=NAV.map(x=>`<a data-nav="${x[0]}" class="${x[0]===view?'on':''}" aria-label="${x[1]}"><svg viewBox="0 0 24 24">${IC[x[0]]}</svg><span class="lb">${x[1]}</span></a>`).join('');
  $('#main').innerHTML=V[view]();if(view==='dash')drawChart();if(view==='chats'){loadThreads();drawA()};bar()}
async function loadThreads(){const{data}=await sb.from('chat_threads').select('*').order('last_message_at',{ascending:false});D.threads=data||[];const l=$('#alist');if(l)l.innerHTML=D.threads.map(h=>`<a class="th ${aT==h.id?'on':''}" data-th="${h.id}">${esc(h.customer_email||'Customer')}</a>`).join('')||'<small style="color:var(--mu)">No chats yet.</small>'}
async function openTh(id){aT=id;const{data}=await sb.from('chat_messages').select('*').eq('thread_id',id).order('id');aMsgs=data||[];drawA();loadThreads()}
function drawA(){const b=$('#amsgs');if(!b)return;b.innerHTML=aMsgs.map(m=>`<div class="cm ${m.sender==='staff'?'me':'them'}">${esc(m.body)}</div>`).join('')||'<small style="color:var(--mu)">Pick a chat on the left.</small>';b.scrollTop=b.scrollHeight}
async function sendReply(body){body=(body||'').trim();if(!body||!aT)return toast('Pick a chat first');
  const{data,error}=await sb.from('chat_messages').insert({thread_id:aT,sender:'staff',body}).select().single();if(error)return toast(error.message);
  if(!aMsgs.find(x=>x.id===data.id)){aMsgs.push(data);drawA()}
  sb.from('chat_threads').update({last_message_at:new Date().toISOString()}).eq('id',aT)}
document.addEventListener('input',e=>{if(e.target.id!=='gs')return;const q=e.target.value.toLowerCase();document.querySelectorAll('#main table tr').forEach((r,i)=>{if(i===0)return;r.style.display=!q||(r.textContent+[...r.querySelectorAll('input')].map(x=>x.value).join(' ')).toLowerCase().includes(q)?'':'none'})});

boot();
</script></body></html>
