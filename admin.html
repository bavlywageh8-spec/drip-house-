<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Driphouse Admin</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#050a08;--bg2:#0a140f;--card:#0d1a14;--card2:#112219;--line:#17302373;--line2:#1d3d2d;--ac:#22e58b;--ac2:#14b86c;--tx:#e9f7ef;--mu:#7f9d8f;--red:#ff5a4f;--gold:#d9a23a;--blue:#4bb8ff;--vio:#8a6bff}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font-family:Poppins,system-ui,sans-serif;background:#020504;color:var(--tx);font-size:13.5px}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(700px 500px at 90% 0,#22e58b14,transparent),radial-gradient(600px 500px at 0 100%,#8a6bff10,transparent);pointer-events:none}
a{cursor:pointer}.btn{border:0;border-radius:999px;padding:10px 22px;font:600 13px Poppins;background:var(--ac);color:#03200f;cursor:pointer;transition:transform .15s,box-shadow .25s}.btn:hover{box-shadow:0 6px 24px #22e58b55}.btn:active{transform:scale(.94)}.btn.sm{padding:6px 14px;font-size:12px}.btn.red{background:#ff5a4f22;color:var(--red);border:1px solid #ff5a4f55}.btn.red:hover{background:var(--red);color:#fff}.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line2)}
input,select{width:100%;background:#08120d;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;color:var(--tx);font:13px Poppins;margin:6px 0 10px}input:focus,select:focus{outline:2px solid var(--ac)}
select option{background:#0d1a14}
.lgn{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative}
.box{width:min(400px,100%);background:linear-gradient(160deg,#0f2118,#0a140f);border:1px solid var(--line2);border-radius:26px;padding:30px;animation:pop .4s;box-shadow:0 30px 80px #000a}.box h1{font-size:24px}.box p{color:var(--mu);font-size:13px;margin:6px 0 14px}
.bl{display:block;height:110px;margin:-10px auto 6px;mix-blend-mode:lighten}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(14px)}}
.lr{display:flex;justify-content:space-between;align-items:center;margin:2px 0 16px}.lr a{color:var(--ac);font-size:12px}label.ck{display:flex;gap:8px;align-items:center;color:var(--mu);font-size:12px}label.ck input{width:auto;margin:0}
.msg{font-size:12px;margin-top:10px;color:var(--ac)}.msg.err{color:var(--red)}
/* app shell: a rounded floating dashboard, icon rail on the left */
#app{display:grid;grid-template-columns:74px 1fr;gap:0;min-height:100vh;position:relative;max-width:1500px;margin:0 auto;padding:14px}
#app>aside,#app>section.m{background:linear-gradient(180deg,#07110c,#050b08);border:1px solid var(--line2)}
aside{border-radius:26px 0 0 26px;border-inline-end:0;padding:18px 10px;position:sticky;top:14px;height:calc(100vh - 28px);display:flex;flex-direction:column;align-items:center;gap:6px}
aside img{height:46px;width:auto;margin:0 auto 18px;mix-blend-mode:lighten}
#nav{display:flex;flex-direction:column;gap:8px;align-items:center}
aside a{position:relative;display:grid;place-items:center;width:46px;height:46px;border-radius:15px;color:var(--mu);transition:.2s}aside a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
aside a span.lb{position:absolute;inset-inline-start:58px;background:var(--ac);color:#03200f;font-weight:600;font-size:12px;padding:5px 11px;border-radius:9px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-6px);transition:.2s;z-index:30}aside a:hover span.lb{opacity:1;transform:none}
aside a:hover{color:var(--ac);background:#22e58b12}aside a.on{background:linear-gradient(135deg,#22e58b,#14b86c);color:#03200f;box-shadow:0 8px 24px #22e58b44}
section.m{border-radius:0 26px 26px 0;padding:0 24px 90px;min-width:0}
header{display:flex;align-items:center;gap:12px;padding:16px 0 14px}header h2{font-size:21px;margin-inline-end:auto;font-weight:600}header small{color:var(--mu)}
.srch{display:flex;align-items:center;gap:8px;background:#08120d;border:1px solid var(--line2);border-radius:999px;padding:0 14px;height:40px;width:min(300px,34vw)}.srch svg{width:16px;height:16px;fill:none;stroke:var(--mu);stroke-width:2;stroke-linecap:round}.srch input{border:0;background:none;margin:0;padding:0;height:100%}.srch input:focus{outline:0}
.av{display:flex;align-items:center;gap:10px;background:#08120d;border:1px solid var(--line2);border-radius:999px;padding:4px 14px 4px 4px}.av i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#22e58b,#4bb8ff);display:grid;place-items:center;color:#03200f;font:700 13px Poppins;font-style:normal}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:14px}
.stat,.panel{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:20px;padding:18px;animation:pop .45s both}.panel{margin-bottom:14px;overflow-x:auto}
.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(#22e58b22,transparent 70%)}
.stat .ico{width:34px;height:34px;border-radius:11px;background:#22e58b1a;color:var(--ac);display:grid;place-items:center;margin-bottom:10px}.stat .ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat small{color:var(--mu)}.stat b{display:block;font-size:27px;margin:4px 0 6px;font-weight:600;letter-spacing:-.5px}.up,.dn{font-size:11.5px;display:inline-flex;gap:6px;align-items:center}.up{color:var(--ac)}.dn{color:var(--red)}.up i,.dn i{color:var(--mu);font-style:normal}
.g2{display:grid;grid-template-columns:1.7fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:1.7fr 1fr;gap:14px}.g2>.panel,.g3>.panel{margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.ph b{font-size:15px;font-weight:600}.ph select{width:auto;margin:0;padding:6px 12px;border-radius:999px}
.lgd{display:flex;gap:14px;font-size:11px;color:var(--mu);margin-bottom:6px}.lgd i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px}
#chart{position:relative}#chart svg{width:100%;display:block}#tip{position:absolute;opacity:0;pointer-events:none;transform:translate(-50%,-135%);background:#fff;color:#04140c;border-radius:10px;padding:6px 11px;font-size:11px;white-space:nowrap;transition:opacity .15s;box-shadow:0 8px 24px #000a}#tip b{display:block;font-size:14px}
.donut{position:relative;width:190px;margin:4px auto}.donut svg{width:100%}.donut div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.donut small{color:var(--mu);font-size:11px}.donut b{font-size:20px;font-weight:600}
.leg{display:grid;gap:8px;margin-top:12px}.leg div{display:flex;align-items:center;gap:8px;font-size:12px}.leg i{width:10px;height:10px;border-radius:50%}.leg span{margin-inline-start:auto;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mu);font-weight:500;text-align:start;font-size:12px}td,th{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border-bottom:0}
.pn{display:flex;align-items:center;gap:10px}.pn i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:700 12px Poppins;font-style:normal;color:#03200f}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;gap:10px}.row:last-child{border-bottom:0}.row small{color:var(--mu)}
.pill{border-radius:999px;padding:3px 11px;font-size:11px;font-weight:600}.pill.lo{background:#d9a23a26;color:var(--gold)}.pill.zero{background:#ff5a4f26;color:var(--red)}
input.ed,select.ed{background:transparent;border-color:transparent;padding:6px 8px;margin:0;min-width:80px;border-radius:8px}input.ed:hover,select.ed:hover{border-color:var(--line2)}input.ed:focus{background:#08120d;border-color:var(--ac);outline:0}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}.frm input,.frm select{margin:0}
#savebar{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);display:flex;gap:16px;align-items:center;background:var(--card2);border:1px solid var(--ac);border-radius:999px;padding:8px 8px 8px 22px;box-shadow:0 10px 40px #000a;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);z-index:15}#savebar.on{transform:translate(-50%,0)}
.toast{position:fixed;bottom:84px;left:50%;transform:translate(-50%,80px);background:var(--ac);color:#03200f;padding:10px 20px;border-radius:999px;font-weight:600;transition:.35s;z-index:20;opacity:0;pointer-events:none}.toast.on{transform:translate(-50%,0);opacity:1}
.achat{display:grid;grid-template-columns:220px 1fr;gap:12px;height:420px}#alist{overflow-y:auto;border-inline-end:1px solid var(--line2);padding-inline-end:8px}.th{display:block;padding:9px 10px;border-radius:10px;color:var(--mu);cursor:pointer;margin-bottom:4px;word-break:break-all;font-size:12px}.th.on,.th:hover{background:#08120d;color:var(--ac)}
#aconv{display:flex;flex-direction:column;min-width:0}#amsgs{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}.cm{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13px;word-break:break-word}.cm.me{align-self:flex-end;background:var(--ac);color:#03200f}.cm.them{align-self:flex-start;background:#08120d}
#rp{display:flex;gap:8px;border-top:1px solid var(--line2);padding-top:10px}#rp input{margin:0}
@media(max-width:860px){#app{grid-template-columns:1fr;padding:8px}aside{position:static;height:auto;flex-direction:row;border-radius:22px 22px 0 0;overflow-x:auto;padding:10px}aside img{display:none}#nav{flex-direction:row}aside a span.lb{display:none}section.m{border-radius:0 0 22px 22px;padding:0 14px 90px}.g2,.g3,.achat{grid-template-columns:1fr}.srch{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ===== login: the picture is the background, the live card sits exactly on its card ===== */
:root{--gd:#f2b93b;--gd3:#b9801a}
.lgn{position:relative;min-height:100vh;overflow:hidden;background:#04050a;display:block;padding:0}
.lstage{position:absolute;left:50%;top:50%;width:max(100vw,calc(100vh*1.7768));aspect-ratio:1672/941;transform:translate(-50%,-50%);background-size:100% 100%;background-repeat:no-repeat;container-type:inline-size}
.lgn .box{position:absolute;left:52.3%;top:13.6%;width:41.4%;height:77.7%;max-width:none;margin:0;padding:0;border-radius:2.3cqw;background:linear-gradient(180deg,#0c0c11,#050508);border:.2cqw solid #e8b94a;box-shadow:0 0 2.2cqw #f2b93b88,inset 0 0 3cqw #f2b93b14;animation:none}
.lgn .box>*{position:absolute}
.crest{left:50%;top:-12.9%;width:33.8%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:#050508;border:.2cqw solid #e8b94a;box-shadow:0 0 1.8cqw #f2b93b99;display:grid;place-items:center;overflow:hidden}.crest img{width:94%;mix-blend-mode:lighten}
.lgn .box .t{left:0;right:0;top:20.4%;text-align:center;font-size:2.65cqw;font-weight:500;line-height:1.2}.t span{color:var(--gd);font-weight:600}
.lgn .box .st{left:0;right:0;top:29.2%;text-align:center;font-size:1.3cqw;color:#dfe3ee;margin:0}
.fld{left:8.9%;width:82.9%;height:9.4%}.f1{top:36.5%}.f2{top:48.8%}
.fld>svg{position:absolute;left:2.2cqw;top:50%;transform:translateY(-50%);width:2cqw;height:2cqw;fill:none;stroke:#eef0f6;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;z-index:1;pointer-events:none}
.lgn .fld input{width:100%;height:100%;margin:0;padding:0 5cqw 0 5.6cqw;border-radius:1.25cqw;background:#07090f;border:.1cqw solid #8a93ab;color:#fff;font-size:1.4cqw}.lgn .fld input:focus{outline:0;border-color:var(--gd);box-shadow:0 0 1cqw #f2b93b66}
.eye{position:absolute;right:1.6cqw;top:50%;transform:translateY(-50%);background:none;border:0;color:#c6cad8;cursor:pointer;display:grid;padding:0}.eye svg{width:2cqw;height:2cqw;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lgn .lr{left:8.9%;right:8.9%;top:60.2%;height:5.6%;margin:0;display:flex;justify-content:space-between;align-items:center}
.lgn .lr a{color:var(--gd);font-size:1.35cqw;font-weight:500}.lgn label.ck{color:#fff;font-size:1.35cqw;gap:.8cqw}.lgn label.ck input{width:1.6cqw;height:1.6cqw;accent-color:var(--gd);margin:0}
.btn.gold{left:8.9%;width:82.9%;top:69.7%;height:9.8%;padding:0;display:flex;align-items:center;justify-content:center;gap:.9cqw;font-size:1.75cqw;color:#1a1200;background:linear-gradient(180deg,#ffe08a,#f2b93b 55%,#c98a14);box-shadow:0 0 1.5cqw #f2b93b77,inset 0 .1cqw 0 #fff8}.btn.gold:hover{box-shadow:0 0 2.4cqw #f2b93bcc,inset 0 .1cqw 0 #fff8}
.btn.gold svg,.btn.back svg{width:2cqw;height:2cqw;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.or{left:8.9%;width:82.9%;top:81.6%;height:4.2%;display:flex;align-items:center;gap:1.2cqw;color:#e5e7ef;font-size:1.3cqw}.or:before,.or:after{content:"";flex:1;height:1px;background:#4a5370}
.btn.back{left:8.9%;width:82.9%;top:87.4%;height:7.8%;padding:0;display:flex;align-items:center;justify-content:center;gap:.8cqw;background:transparent;color:#fff;border:.1cqw solid #c8cddc;text-decoration:none;font-size:1.45cqw;font-weight:400}.btn.back:hover{background:#ffffff0d;box-shadow:none}.btn.back svg{stroke:var(--gd)}
.lgn .msg{left:0;right:0;top:101.5%;text-align:center;margin:0;font-size:1.2cqw}
.btn:hover{transform:none!important}
@media(max-width:860px){
.lgn .lstage{position:relative;left:auto;top:auto;transform:none;width:100%;aspect-ratio:auto;min-height:100vh;min-height:100dvh;background-size:cover;background-position:18% 50%;container-type:normal;display:flex;align-items:center;justify-content:center;padding:76px 16px 28px}
.lgn .lstage:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#04050acc,#04050a66 45%,#04050acc)}
.lgn .lstage .box{position:relative;left:auto;top:auto;width:100%;max-width:380px;height:auto;padding:62px 20px 22px;border-radius:24px;border-width:2px;background:#07070bf2;box-shadow:0 0 28px #f2b93b66;display:flex;flex-direction:column}
.lgn .lstage .box>*{position:relative;left:auto;right:auto;top:auto;width:auto;height:auto}
.lgn .lstage .box>.crest{position:absolute;left:50%;top:-46px;width:92px;height:92px;transform:translateX(-50%);border-width:3px}
.lgn .lstage .box>.t{font-size:23px;margin:0;line-height:1.25}
.lgn .lstage .box>.st{font-size:13px;margin:4px 0 18px}
.lgn .lstage .box>.fld{width:100%;height:50px;margin:0 0 12px}
.lgn .lstage .box .fld>svg{left:16px;width:20px;height:20px}
.lgn .lstage .box .fld input{padding:0 46px 0 48px;font-size:16px;border-radius:14px}
.lgn .lstage .box .eye{right:12px}.lgn .lstage .box .eye svg{width:20px;height:20px}
.lgn .lstage .box>.lr{display:flex;width:100%;margin:4px 0 16px}
.lgn .lstage .box>.lr a,.lgn .lstage .box>.lr label.ck{font-size:13px}.lgn .lstage .box>.lr label.ck{gap:8px}.lgn .lstage .box>.lr label.ck input{width:17px;height:17px}
.lgn .lstage .box>.btn.gold{display:flex;width:100%;height:50px;font-size:16px;gap:8px}
.lgn .lstage .box>.btn.back{display:flex;width:100%;height:48px;font-size:15px;gap:8px}
.lgn .lstage .box>.btn.gold svg,.lgn .lstage .box>.btn.back svg{width:20px;height:20px}
.lgn .lstage .box>.or{width:100%;margin:14px 0;font-size:12px;gap:12px}
.lgn .lstage .box>.msg{margin:12px 0 0;font-size:12px}
}
@media(max-width:860px) and (max-height:620px){.lgn .lstage{align-items:flex-start;padding-top:70px}}
/* stop browsers painting autofill yellow */
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px #07090f inset!important;box-shadow:0 0 0 1000px #07090f inset!important;-webkit-text-fill-color:#fff!important;caret-color:#fff;transition:background-color 99999s}

const ed=(k,o,f,type='text',w='')=>`<input class="ed" type="${type}" ${type==='number'?'step="any"':''} value="${esc(o[f])}" data-k="${k}" data-id="${o.id}" data-f="${f}" style="${w}">`;

V.dash=()=>{
  const ok=D.orders.filter(o=>o.status!=='cancelled'),now=Date.now(),W=864e5,sum=l=>l.reduce((s,o)=>s+Number(o.total),0);
  const win=(l,a,b)=>l.filter(o=>{const t=+new Date(o.created_at);return t>=now-a*W&&t<now-b*W});
  const cs=D.profiles.filter(p=>p.role==='customer'),ICS={'Total sales':'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>','Total orders':'<path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0"/>','Customers':'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.6-7 8-7s8 2.5 8 7"/>'},stat=(l,v,c,p)=>`<div class="stat"><div class="ico"><svg viewBox="0 0 24 24">${ICS[l]}</svg></div><small>${l}</small><b>${v}</b>${badge(c,p)}</div>`;
  const tot=sum(ok),C=2*Math.PI*60;let acc=0;
  const segs=Object.keys(M).map(k=>({k,v:sum(ok.filter(o=>(o.payment_method||'cash')===k))}));
  const circ=segs.map(s=>{const len=tot?s.v/tot*C:0,c=`<circle cx="80" cy="80" r="60" fill="none" stroke="${COL[s.k]}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)"/>`;acc+=len;return c}).join('');
  const st={};D.orders.forEach(o=>st[o.id]=o.status);const top={};
  D.items.filter(i=>st[i.order_id]&&st[i.order_id]!=='cancelled').forEach(i=>{const k=i.product_id||i.name;const r=top[k]??={name:i.name,q:0,rev:0,pid:i.product_id};r.q+=i.qty;r.rev+=i.qty*i.price});
  const tl=Object.values(top).sort((a,b)=>b.rev-a.rev).slice(0,5);
  const low=[...D.products].filter(p=>p.stock<=10).sort((a,b)=>a.stock-b.stock).slice(0,6);
  const staff=D.profiles.filter(p=>p.role==='admin').map(p=>{const os=D.orders.filter(o=>o.handled_by===p.id);return{e:p.email,n:os.length,s:sum(os),m:D.staffMsgs.filter(x=>x.staff_id===p.id).length}});
  return `<div class="stats">${stat('Total sales',money(tot),sum(win(ok,7,0)),sum(win(ok,14,7)))}${stat('Total orders',D.orders.length,win(D.orders,7,0).length,win(D.orders,14,7).length)}${stat('Customers',cs.length,cs.filter(p=>+new Date(p.created_at)>now-7*W).length,cs.filter(p=>{const t=+new Date(p.created_at);return t>now-14*W&&t<=now-7*W}).length)}</div>
  <div class="g2" style="margin-bottom:16px"><div class="panel"><div class="ph"><b>Sales performance</b><select id="rng"><option value="7" ${range==7?'selected':''}>Last 7 days</option><option value="30" ${range==30?'selected':''}>Last 30 days</option></select></div><div class="lgd"><span><i style="background:#22e58b"></i>Total sales</span><span><i style="background:#8a6bff"></i>Orders (x10)</span></div><div id="chart"></div></div>
  <div class="panel"><div class="ph"><b>Payment methods</b></div><div class="donut"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="60" fill="none" stroke="#1a3a2b" stroke-width="16"/>${circ}</svg><div><small>Total</small><b>${money(tot)}</b></div></div><div class="leg">${segs.map(s=>`<div><i style="background:${COL[s.k]}"></i>${M[s.k]}<span>${money(s.v)}</span></div>`).join('')}</div></div></div>
  <div class="g3"><div class="panel"><div class="ph"><b>Top selling products</b></div><table><tr><th>Product</th><th>Sold</th><th>Revenue</th><th>Stock</th></tr>${tl.map(p=>`<tr><td><div class="pn"><i style="background:${D.products.find(x=>x.id===p.pid)?.color||'#22e58b'}">${esc(p.name)[0]}</i>${esc(p.name)}</div></td><td>${p.q}</td><td>${money(p.rev)}</td><td>${D.products.find(x=>x.id===p.pid)?.stock??'-'}</td></tr>`).join('')||'<tr><td colspan=4 style="color:var(--mu)">No sales yet.</td></tr>'}</table></div>
  <div><div class="panel"><div class="ph"><b>Inventory alerts</b></div>${low.map(p=>`<div class="row"><span>${esc(p.name)}</span><span class="pill ${p.stock<=0?'zero':'lo'}">${p.stock<=0?'Out':p.stock+' left'}</span></div>`).join('')||'<small style="color:var(--mu)">All products are well stocked.</small>'}</div>
  <div class="panel"><div class="ph"><b>Employee performance</b></div>${staff.map(s=>`<div class="row"><span>${esc(s.e)}<br><small>${s.n} orders, ${s.m} chat replies</small></span><b>${money(s.s)}</b></div>`).join('')}</div></div></div>`};
function drawChart(){const box=$('#chart');if(!box)return;
  const ok=D.orders.filter(o=>o.status!=='cancelled'),n=range,vals=[],labs=[];
  for(let i=n-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const a=+d,b=a+864e5;vals.push(ok.filter(o=>{const t=+new Date(o.created_at);return t>=a&&t<b}).reduce((s,o)=>s+Number(o.total),0));labs.push(d.toLocaleDateString(undefined,{month:'short',day:'numeric'}))}
  const W=620,H=230,l=44,r=12,t=14,b=26,mx=Math.max(...vals,1),X=i=>l+i*(W-l-r)/(n-1),Y=v=>H-b-v/mx*(H-t-b),pts=vals.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');const cnt=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const s=+d;cnt.push(ok.filter(o=>{const t=+new Date(o.created_at);return t>=s&&t<s+864e5}).length)}const cm=Math.max(...cnt,1),pts2=cnt.map((v,i)=>`${X(i)},${Y(v/cm*mx*.8)}`).join(' ');
  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${l}" x2="${W-r}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="#173023"/><text x="${l-6}" y="${Y(mx*f)+4}" text-anchor="end" fill="#86a899" font-size="10">${Math.round(mx*f)}</text>`).join('');
  const xl=labs.map((s,i)=>i%Math.ceil(n/7)===0?`<text x="${X(i)}" y="${H-8}" text-anchor="middle" fill="#86a899" font-size="10">${s}</text>`:'').join('');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22e58b" stop-opacity=".45"/><stop offset="1" stop-color="#22e58b" stop-opacity="0"/></linearGradient></defs>${grid}${xl}<polygon points="${X(0)},${H-b} ${pts} ${X(n-1)},${H-b}" fill="url(#g)"/><polyline points="${pts2}" fill="none" stroke="#8a6bff" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 4" opacity=".9"/><polyline points="${pts}" fill="none" stroke="#22e58b" stroke-width="2.5" stroke-linejoin="round"/><line id="cl" y1="${t}" y2="${H-b}" stroke="#22e58b" stroke-dasharray="4" opacity="0"/><circle id="cd" r="5" fill="#22e58b" opacity="0"/></svg><div id="tip"></div>`;
  box.onmousemove=e=>{const rc=box.getBoundingClientRect(),rx=(e.clientX-rc.left)/rc.width*W,i=Math.max(0,Math.min(n-1,Math.round((rx-l)/((W-l-r)/(n-1)))));
    const cl=$('#cl'),cd=$('#cd'),tip=$('#tip');cl.setAttribute('x1',X(i));cl.setAttribute('x2',X(i));cl.setAttribute('opacity',1);cd.setAttribute('cx',X(i));cd.setAttribute('cy',Y(vals[i]));cd.setAttribute('opacity',1);
    tip.style.cssText=`opacity:1;left:${X(i)/W*100}%;top:${Y(vals[i])/H*100}%`;tip.innerHTML=`${labs[i]}<b>${money(vals[i])}</b>`};
  box.onmouseleave=()=>{$('#cl').setAttribute('opacity',0);$('#cd').setAttribute('opacity',0);$('#tip').style.opacity=0}}
