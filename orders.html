  document.addEventListener('visibilitychange',mark,{once:true});addEventListener('pagehide',mark,{once:true});
  location.href=app;
  setTimeout(()=>{document.removeEventListener('visibilitychange',mark);if(!left&&!document.hidden)location.href=web},1600);
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-wa]');if(!a)return;e.preventDefault();openWA(a.dataset.wa||t('hello2'))});

function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2600)}

/* ---------- data ---------- */
let ORDERS=[],PRODUCTS={},state='loading';
const variantsOf=p=>{let v=p&&p.variants;if(typeof v==='string'){try{v=JSON.parse(v)}catch{v=[]}}return Array.isArray(v)?v.filter(x=>x&&x.name):[]};
async function load(){
  state='loading';render();
  try{
    if(!db)throw new Error('Supabase unavailable');
    const {data:{session}}=await db.auth.getSession();
    const user=session&&session.user;
    if(!user||user.is_anonymous||!user.email){state='login';render();return}
    const {data:orders,error}=await db.from('orders').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(60);
    if(error)throw error;
    ORDERS=orders||[];
    if(ORDERS.length){
      const ids=ORDERS.map(o=>o.id);
      const [it,pr]=await Promise.all([db.from('order_items').select('*').in('order_id',ids),db.from('products').select('*')]);
      if(it.error)throw it.error;
      const by={};(it.data||[]).forEach(r=>(by[r.order_id]=by[r.order_id]||[]).push(r));
      ORDERS.forEach(o=>o.items=by[o.id]||[]);
      PRODUCTS={};(pr.data||[]).forEach(p=>PRODUCTS[String(p.id)]=p);
    }
    state=ORDERS.length?'list':'empty';render();
  }catch(err){console.error('Could not load orders:',err);state='error';render()}
}

/* ---------- render ---------- */
const ICON={
 truck:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.500h11v9H3zM14 9.500h3.500l3 3v3H14"/><circle cx="7.500" cy="17.500" r="1.800"/><circle cx="17" cy="17.500" r="1.800"/></svg>',
 bag:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.500h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8.500h6M9 12h6"/></svg>',
 repeat:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 0 1 13.700-5.600L20 8M20 4v4h-4M20 13a8 8 0 0 1-13.700 5.600L4 16M4 20v-4h4"/></svg>',
 wa:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.95L2 22l5.2-1.5A9.9 9.9 0 1 0 12.04 2zm5.8 14.1c-.25.7-1.4 1.3-1.95 1.35-.5.05-1.1.07-1.8-.12a14 14 0 0 1-5.5-3.6 8.6 8.6 0 0 1-1.8-3.2c-.2-1 .6-1.7.9-2 .25-.25.6-.3.8-.3h.55c.17 0 .4-.07.6.45l.85 2c.07.15.1.3 0 .5l-.4.6c-.13.17-.28.35-.12.62a7.3 7.3 0 0 0 3.3 2.9c.3.14.5.12.7-.07.18-.2.8-.9 1-1.2.2-.3.4-.25.65-.15l1.9.9c.27.12.45.2.5.32.1.15.1.7-.15 1.3z"/></svg>'
};
const statusOf=o=>String(o.status||'pending').toLowerCase();
function statusPill(o){
  const s=statusOf(o),map={pending:'warn',confirmed:'',processing:'',shipped:'',delivered:'',cancelled:'bad',canceled:'bad'};
  const key='st_'+(s==='canceled'?'cancelled':s);
  const label=I[key]?t(key):s.charAt(0).toUpperCase()+s.slice(1);
  return `<span class="pill ${map[s]??''}">${esc(label)}</span>`;
}
function orderNo(o){const id=String(o.id);return '#'+(id.length>10?id.replace(/-/g,'').slice(0,8).toUpperCase():id)}
function calTile(d){return `<div class="d"><i>${esc(fmt(d,{month:'short'}).toUpperCase())}</i><b>${d.getDate()}</b><small>${esc(fmt(d,{weekday:'short'}))}</small></div>`}
function calRange(made){return `<div class="cal">${calTile(addDays(made,3))}<span class="to">→</span>${calTile(addDays(made,5))}</div>`}
function etaBlock(o){
  const s=statusOf(o),made=new Date(o.created_at||Date.now());
  if(s==='cancelled'||s==='canceled')return `<div class="eta" style="border-color:rgba(255,138,138,.3);background:rgba(255,138,138,.06)">${ICON.truck.replace('var(--mint)','')}<div><b>${t('cancelled')}</b></div></div>`;
  if(s==='delivered')return `<div class="eta">${ICON.truck}<div class="eta-line"><b>${t('delivered')}</b><span class="eta-date">${dShort(addDays(made,3))} – ${dShort(addDays(made,5))}</span></div></div>`;
  return `<div class="eta">${ICON.truck}<div><b>${t('expected')}: ${dShort(addDays(made,3))} – ${dShort(addDays(made,5))}</b><span>${t('takes')}</span></div></div>`;
}
function itemRow(it){
  const p=PRODUCTS[String(it.product_id)],img=p&&p.image_url;
  const line=Number(it.price||0)*Number(it.qty||1);
  return `<div class="item"><div class="thumb">${img?`<img src="${esc(img)}" alt="" loading="lazy">`:'✳'}</div><div><div class="i-name">${esc(it.name||p?.name||'')}</div><div class="i-meta">${t('qty')}: ${Number(it.qty||1)} · ${money(it.price)}</div></div><div class="i-price">${money(line)}</div></div>`;
}
function splitAddr(o){
  const raw=String(o.address||''),i=raw.indexOf(' | Google Maps:');
  return {addr:(i<0?raw:raw.slice(0,i)).trim(),map:i<0?'':raw.slice(i+15).trim()};
}
const ARROW='<span class="arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>';
function body(o){
  const made=new Date(o.created_at||Date.now());
  const {addr,map}=splitAddr(o);
  const pay=!o.payment_method||o.payment_method==='cash'?t('cod'):o.payment_method;
  const items=o.items||[];
  const sub=items.reduce((a,it)=>a+Number(it.price||0)*Number(it.qty||1),0);
  const disc=Number(o.discount_amount||o.discount||0);
  const del=Math.max(0,Number(o.total||0)-sub+disc);
  const gv=o.governorate||String(addr||'').split(',')[0].trim();
  const sums=items.length?`<div class="sums"><h4 class="sums-h">${t('paysum')}</h4><div><span>${t('itemsCost')}</span><span>${money(sub)}</span></div>${disc>0?`<div class="disc"><span>${t('discount')}${o.promo_code?' ('+esc(o.promo_code)+')':''}</span><span>− ${money(disc)}</span></div>`:''}<div><span>${t('delFee')}${gv?' · '+esc(gv):''}</span><span>${del>0?money(del):t('free')}</span></div></div>`:'';
  return `${etaBlock(o)}
   <div class="items">${items.map(itemRow).join('')}</div>${sums}
   <div class="total"><span>${t('total')}</span><b>${money(o.total)}</b></div>
   <div class="info">
     ${o.customer_name?`<div><small>${t('name')}</small><span>${esc(o.customer_name)}</span></div>`:''}
     <div><small>${t('phone')}</small><span dir="ltr">${esc(o.phone||'')}</span></div>
     ${o.customer_email?`<div><small>${t('email')}</small><span dir="ltr">${esc(o.customer_email)}</span></div>`:''}
     <div><small>${t('payment')}</small><span>${esc(pay)}</span></div>
     ${o.governorate?`<div><small>${t('gov')}</small><span>${esc(o.governorate)}</span></div>`:''}
     ${o.city?`<div><small>${t('city')}</small><span>${esc(o.city)}</span></div>`:''}
     <div style="grid-column:1/-1"><small>${t('address')}</small><span>${esc(addr)}</span></div>
   </div>
   <div class="actions">
     <button class="btn primary" type="button" data-again-toggle="${esc(o.id)}">${ICON.repeat}<span>${t('again')}</span></button>
     <a class="btn ghost wa" href="https://wa.me/${WA}" data-wa="${esc(t('hello')+' '+orderNo(o)+' ('+dLong(made)+').')}">${ICON.wa}<span>${t('ask')}</span></a>
   </div>
   <div class="again-box" id="ab-${esc(o.id)}"><p>${t('ag_q')}</p><div class="ship-prev">${esc([o.customer_name,o.phone,addr].filter(Boolean).join(' · '))}</div><small>${t('ag_note')}</small>
     <div class="row"><button class="btn primary" type="button" data-again="${esc(o.id)}" data-ship="same">${t('ag_s')}</button><button class="btn ghost" type="button" data-again="${esc(o.id)}" data-ship="new">${t('ag_d')}</button></div></div>`;
}
function orderCard(o,isOld){
  const made=new Date(o.created_at||Date.now());
  if(!isOld)return `<article class="card" data-order="${esc(o.id)}">
   <div class="o-head"><div><div class="o-num">${t('order')} ${esc(orderNo(o))}</div><div class="o-date">${t('placed')} ${dLong(made)}</div></div>${statusPill(o)}</div>${body(o)}</article>`;
  return `<article class="card old" data-order="${esc(o.id)}">
   <button class="old-head" type="button" data-toggle="${esc(o.id)}" aria-expanded="false"><div class="l"><div class="o-num">${t('order')} ${esc(orderNo(o))}</div><div class="o-date">${dLong(made)}</div></div><div class="r">${statusPill(o)}<span class="tt">${money(o.total)}</span>${ARROW}</div></button>
   <div class="o-body">${body(o)}</div></article>`;
}
function render(){
  const box=$('#list');applyStatic();
  $('#note').hidden=state!=='list'&&state!=='empty';
  if(state==='loading'){box.innerHTML='<div class="sk"></div><div class="sk"></div>';return}
  if(state==='login'){box.innerHTML=`<div class="card empty">${ICON.bag}<h2>${t('login_t')}</h2><p>${t('login_p')}</p><a class="btn" href="index.html">${t('login_b')}</a></div>`;return}
  if(state==='error'){box.innerHTML=`<div class="card empty">${ICON.bag}<h2>${t('err_t')}</h2><p>${t('err_p')}</p><button class="btn" id="retry" type="button">${t('retry')}</button></div>`;$('#retry').onclick=load;return}
  if(state==='empty'){box.innerHTML=`<div class="card empty">${ICON.bag}<h2>${t('empty_t')}</h2><p>${t('empty_p')}</p><a class="btn" href="index.html">${t('shop')}</a></div>`;return}
  const openIds=new Set([...document.querySelectorAll('.card.old.open')].map(x=>x.dataset.order));
  box.innerHTML=orderCard(ORDERS[0],false)+(ORDERS.length>1?`<div class="old-title">${t('older')} (${ORDERS.length-1})</div>`+ORDERS.slice(1).map(o=>orderCard(o,true)).join(''):'');
  openIds.forEach(id=>{const c=box.querySelector(`.card.old[data-order="${CSS.escape(id)}"]`);if(c)c.classList.add('open')});
}

/* ---------- collapse / expand older orders, order-again choice, legal modal ---------- */
document.addEventListener('click',e=>{
  const tg=e.target.closest('[data-toggle]');
  if(tg){const c=tg.closest('.card');const on=c.classList.toggle('open');tg.setAttribute('aria-expanded',on);return}
  const ab=e.target.closest('[data-again-toggle]');
  if(ab){const bx=document.getElementById('ab-'+ab.dataset.againToggle);if(bx)bx.classList.toggle('on');return}
  const lg=e.target.closest('[data-legal]');
  if(lg){const k=lg.dataset.legal;$('#mdlT').textContent=t(k+'_link');$('#mdlP').textContent=t(k+'_intro');$('#mdlL').innerHTML=[1,2,3].map(i=>`<li>${esc(t(k+'_'+i))}</li>`).join('');$('#mdl').classList.add('on');return}
  if(e.target.id==='mdl'||e.target.id==='mdlX')$('#mdl').classList.remove('on');
});

/* order again: same items go to the cart; shipping is either reused or left blank */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-again]');if(!b)return;
  const o=ORDERS.find(x=>String(x.id)===b.dataset.again);if(!o)return;
  let cart=[];try{cart=JSON.parse(localStorage.getItem('driphouse_cart')||'[]')}catch{}
  let added=0,skipped=0;
  for(const it of o.items||[]){
    const p=PRODUCTS[String(it.product_id)];
    if(!p||Number(p.stock)<=0){skipped++;continue}
    const id=String(it.product_id),nm=String(it.name||'');let v='';
    for(const vr of variantsOf(p)){if(nm.endsWith(' — '+vr.name)){v=vr.name;break}}
    const qty=Math.max(1,Math.min(Number(it.qty)||1,Number(p.stock)));
    const line=cart.find(c=>String(c.id)===id&&(c.v||'')===v);
    if(line)line.qty=Math.min(line.qty+qty,Number(p.stock));else{const r={id,qty};if(v)r.v=v;cart.push(r)}
    added++;
  }
  if(!added){toast(t('none'));return}
  try{
    if(b.dataset.ship==='same'){
      const {addr}=splitAddr(o),parts=addr.split(', ');
      const gov=o.governorate||parts[0]||'',city=o.city||parts[1]||'';
      const street=(o.governorate&&o.city&&parts[0]===gov&&parts[1]===city?parts.slice(2):parts).join(', ');
      sessionStorage.setItem('dh_ship',JSON.stringify({name:o.customer_name||'',phone:o.phone||'',governorate:gov,city:city,street:street}));
    }else sessionStorage.removeItem('dh_ship');
  }catch{}
  localStorage.setItem('driphouse_cart',JSON.stringify(cart));
  sessionStorage.setItem('dh_open_cart','1');
  toast(t('added')+(skipped?` · ${skipped} ${t('unavail')}`:''));
  setTimeout(()=>{location.href='index.html'},skipped?1300:500);
});

applyStatic();load();
</script>
