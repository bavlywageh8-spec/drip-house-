<style>
:root{--bg:#080b0c;--bg2:#0e1516;--card:#0f1a1b;--line:#1c2d2f;--ac:#19e6c1;--tx:#e8f6f4;--mu:#8aa9a8;--red:#ff5a4f;--gold:#19e6c1}
*{box-sizing:border-box;margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(600px 400px at 75% 10%,#19e6c112,transparent),radial-gradient(500px 400px at 5% 90%,#19e6c10a,transparent);pointer-events:none}
a{color:inherit;text-decoration:none;cursor:pointer}
nav{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:6px;padding:10px 5vw;background:#080b0ccc;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .logo{font-weight:700;font-size:20px;margin-inline-end:auto}nav .logo{display:flex;align-items:center;gap:10px}nav .logo img{height:46px;width:auto;mix-blend-mode:lighten;user-select:none;-webkit-user-drag:none}.box .bl{display:block;height:110px;margin:-10px auto 6px;mix-blend-mode:lighten}
nav a{color:var(--mu);font-size:14px;transition:color .2s}nav a:hover{color:var(--ac)}
main{position:relative;padding:0 5vw 80px;min-height:80vh}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 26px;font:600 14px Poppins;background:var(--ac);color:#04201b;cursor:pointer;transition:transform .15s ease,box-shadow .25s;will-change:transform}
.btn:hover{box-shadow:0 8px 30px #19e6c155}.btn{transform:none!important}.btn:active{transform:scale(.94)!important}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}.btn.sm{padding:7px 14px;font-size:12px}.btn.red{background:var(--red);color:#fff}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;min-height:78vh}
.hero h1{font-size:clamp(40px,7vw,84px);line-height:1;letter-spacing:-2px}
.hero p{color:var(--mu);margin:18px 0 28px;max-width:44ch;line-height:1.6}
.hero{position:relative}
.hero h1{background:linear-gradient(180deg,#fff,#a8d9d2);-webkit-background-clip:text;background-clip:text;color:transparent}
.stage{position:relative;display:grid;place-items:center;padding-top:30px;min-height:min(600px,80vh);perspective:1100px}
.stage:before{content:"";position:absolute;left:50%;bottom:6%;width:78%;height:70px;transform:translateX(-50%);background:radial-gradient(closest-side,#19e6c140,transparent);filter:blur(10px)}
.stage:after{content:"";position:absolute;inset:-10% -15%;background:radial-gradient(45% 55% at 50% 45%,#19e6c118,transparent 70%);pointer-events:none}

.dev{position:relative;z-index:2;transform:rotate(16deg)}
.dev svg{height:min(470px,58vh);width:auto;display:block;filter:drop-shadow(0 36px 40px #000c) drop-shadow(0 0 30px #19e6c122)}
.spec{position:absolute;z-index:4;right:2%;bottom:10%;background:#0a1011cc;border:1px solid var(--line);border-radius:16px;padding:10px 14px;backdrop-filter:blur(10px);font-size:12px;line-height:1.5}.spec b{display:block;font-size:13px}.spec span{color:var(--ac);font-weight:600}
.hint{position:absolute;z-index:4;left:4%;bottom:8%;color:var(--mu);font-size:11px}
@keyframes float{50%{transform:translateY(-16px) rotate(2deg)}}
@keyframes rise{0%{transform:translateY(60px) scale(.4);opacity:0}30%{opacity:.7}100%{transform:translateY(-80px) scale(1.5);opacity:0}}
h2{font-size:28px;margin:60px 0 24px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:transform .25s,border-color .25s}
.card:hover{border-color:var(--ac)}
.card .img{height:180px;border-radius:14px;background:radial-gradient(70% 70% at 50% 60%,#19e6c120,#080d0e 75%);display:grid;place-items:center;margin-bottom:12px}
.card .img svg{height:140px;transition:transform .4s}.card .img svg{filter:drop-shadow(0 14px 14px #000a)}
.card h3{font-size:15px;font-weight:500}.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.price{color:var(--ac);font-weight:600}
.tag{font-size:11px;background:var(--ac);color:#04201b;border-radius:6px;padding:2px 8px;font-weight:600}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 20px;font-size:13px;cursor:pointer;color:var(--mu);transition:.2s}.chip.on,.chip:hover{background:var(--ac);color:#04201b;border-color:var(--ac)}
.rv{opacity:0;transform:translateY(40px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding-top:40px;align-items:center;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(20px)}}
.pd .big{background:var(--card);border:1px solid var(--line);border-radius:24px;height:min(480px,60vw);display:grid;place-items:center}.pd .big svg{height:80%;animation:float 5s ease-in-out infinite}
.pd h1{font-size:34px;margin:10px 0}.pd p{color:var(--mu);line-height:1.7;margin:12px 0}.pd .price{font-size:32px;display:block;margin:14px 0}
.qty{display:inline-flex;align-items:center;gap:12px;margin-inline-end:12px}.qty b{min-width:20px;text-align:center}
.box{max-width:420px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;animation:pop .4s}
.box h1{font-size:26px;margin-bottom:6px}.tabs{display:flex;gap:6px;margin:16px 0}.tabs .chip{flex:1;text-align:center}
input,select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--tx);font:14px Poppins;margin:6px 0 12px}
input:focus{outline:2px solid var(--ac)}label.ck{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mu)}label.ck input{width:auto;margin:0}

@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.4)}14%{opacity:.85}100%{opacity:0;transform:translate(var(--dx,24px),-300px) scale(5)}}

.dev.ph{transform:none}.dev.ph .hphoto{height:min(470px,58vh);max-width:100%;object-fit:cover;border-radius:28px;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent);mask-image:radial-gradient(closest-side,#000 72%,transparent)}
.soc{position:absolute;left:-3.4vw;top:50%;transform:translateY(-50%);display:grid;gap:14px;z-index:3}
.soc a,.soc button{width:30px;height:30px;border-radius:50%;border:1px solid #19e6c155;background:#0b1a1d;color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:.2s}
.soc svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.soc a:hover,.soc button:hover{background:var(--ac);color:#04201b;border-color:var(--ac)}
/* new-arrival cards */
.rw.arr{margin-bottom:10px}.arr .pc{flex:0 0 calc(25% - 11px);background:linear-gradient(180deg,#142226,#0b1416);border-color:#22393b}
.arr .pimg{aspect-ratio:4/4.3;background:radial-gradient(70% 70% at 50% 62%,#19e6c133,#071516 78%)}
.arr .pb{padding:14px}.nr2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nr2 .price{font-weight:600;font-size:15px}
.quick{width:34px;height:34px;border-radius:50%;border:1px solid #19e6c166;background:#19e6c114;color:var(--ac);display:grid;place-items:center;cursor:pointer;transition:.2s;flex:none}
.quick svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.quick:hover{background:var(--ac);color:#04201b;box-shadow:0 0 18px #19e6c188}.quick:disabled{opacity:.35;cursor:not-allowed}
h2#arrivals{margin:40px 0 22px;font-size:32px}h2#arrivals:after{content:"";display:block;width:56px;height:3px;border-radius:3px;margin:12px auto 0;background:var(--ac)}
@media(max-width:900px){.arr .pc{flex-basis:calc(50% - 7px)}.soc{display:none}}

.fog{position:absolute;left:-8%;top:-8%;width:116%;height:116%;mix-blend-mode:screen;pointer-events:none}
.fog.f1{opacity:.4;animation:fog1 34s ease-in-out infinite alternate}.fog.f2{opacity:.2;animation:fog2 26s ease-in-out infinite alternate}
@keyframes fog1{from{transform:translate(-3%,2%) scale(1)}to{transform:translate(3%,-3%) scale(1.14)}}
@keyframes fog2{from{transform:translate(3%,-2%) scale(1.1) rotate(0)}to{transform:translate(-4%,3%) scale(1) rotate(2deg)}}

/* 3D vape */
.dev.g3{transform:scale(1.2);transform-origin:50% 55%;width:380px;height:560px;position:relative;filter:drop-shadow(0 40px 36px #000c)}
.d3{position:absolute;inset:0;perspective:1300px;perspective-origin:50% 38%;animation:d3f 7s ease-in-out infinite}
@keyframes d3f{50%{transform:translateY(-14px)}}
.d3 .lean{position:absolute;left:0;top:0;width:380px;height:560px;transform-style:preserve-3d;transform:rotateZ(11deg)}
.d3 .rig{position:absolute;left:190px;top:286px;width:0;height:0;transform-style:preserve-3d}
.d3 .s{position:absolute;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden;will-change:background-color}
.d3 .m-body{background-image:linear-gradient(180deg,#ffffff26 0,#ffffff00 12%,#0000 58%,#0000006e 100%)}
.d3 .m-chrome{background-image:linear-gradient(180deg,#ffffff55,#0000 45%,#00000066)}
.d3 .m-glass{background-image:linear-gradient(180deg,#ffffff30,#0000 25%,#0000 75%,#19e6c122)}
.d3 .m-liq{background-image:linear-gradient(180deg,#ffffff22,#0000 50%,#00000040)}
.d3 .m-tip{background-image:linear-gradient(180deg,#ffffff30,#0000 40%,#00000066)}
.d3 .front{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform:translateZ(43.5px)}
.d3 .front>*{position:absolute;backface-visibility:hidden;transform:translateZ(.5px)}
.d3 .scr{left:-32px;top:6px;width:64px;height:42px;border-radius:7px;background:linear-gradient(160deg,#04100f,#010605);border:1.5px solid #2a3a3c;box-shadow:inset 0 0 12px #19e6c133,0 0 14px #19e6c133;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:Poppins,sans-serif}
.d3 .scr b{font-size:19px;line-height:1;color:#19e6c1;text-shadow:0 0 8px #19e6c1;font-weight:600}.d3 .scr small{font-size:9px;margin-left:1px}
.d3 .scr span{display:flex;gap:3px}.d3 .scr span i{width:9px;height:3px;border-radius:2px;background:#19e6c1;opacity:.85;box-shadow:0 0 5px #19e6c1}.d3 .scr span i:last-child{opacity:.25}
.d3 .fire{left:-19px;top:78px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8f0f2,#7d8a90 45%,#2a3236);box-shadow:0 0 0 2px #0a0d0f,0 0 0 4px #19e6c155,0 0 16px #19e6c177;display:grid;place-items:center}
.d3 .fire i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#19e6c1,#0b8f7c);box-shadow:0 0 12px #19e6c1;animation:led 2.4s ease-in-out infinite}@keyframes led{50%{opacity:.45}}
.d3 .brand{left:-50px;width:100px;top:168px;text-align:center;font:600 9px Poppins,sans-serif;letter-spacing:.34em;color:#9fb2b2;opacity:.65}
.d3 .bar{left:-30px;top:128px;width:60px;height:3px;border-radius:2px;background:linear-gradient(90deg,#0000,#19e6c1aa,#0000)}
.d3 .tglow{position:absolute;left:90px;top:80px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,#19e6c140,transparent);filter:blur(14px)}
.d3 .flr{position:absolute;left:70px;top:512px;width:240px;height:30px;border-radius:50%;background:radial-gradient(closest-side,#19e6c155,transparent);filter:blur(6px)}
.d3 .puffs{position:absolute;inset:0;pointer-events:none}.d3 .puffs b{top:34px;left:190px}
@media(max-width:760px){.hero.hs{padding-top:36px}.dev.g3{transform:scale(.8);margin:-70px 0 -80px}}

/* ===== DRIPHOUSE redesign layer: matches reference mockup ===== */
h2#arrivals{display:flex;align-items:center;gap:26px;font-size:clamp(28px,3.4vw,42px);margin:10px 0 28px}
h2#arrivals:before,h2#arrivals:after{content:"";flex:1;height:1px;width:auto;margin:0;border-radius:0;background:#2a3b3f}
.arr .pc{background:linear-gradient(180deg,#0e171b,#091013);border:1px solid #1f3237;border-radius:22px;padding:0;overflow:hidden}
.arr .pc:hover{border-color:#2fe6c366;box-shadow:0 0 34px #2fe6c322;transform:translateY(-4px)}
.arr .pimg{border-radius:0;aspect-ratio:1/.86;background:radial-gradient(60% 70% at 50% 55%,#19e6c133,transparent 75%)}
.arr .pb{padding:4px 22px 22px}.arr .pb h3{font-size:15px;font-weight:500;color:#e6efef}
.arr .nr2{margin-top:14px}.arr .price{font-size:21px;font-weight:700;color:var(--ac);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.op{color:#8b9a9c;font-size:14px;font-weight:400}
.dbg{position:absolute;top:10px;inset-inline-start:10px;z-index:2;background:var(--ac);color:#04201b;font:700 11px Poppins;border-radius:999px;padding:3px 9px}
.quick{width:44px;height:44px;border-radius:12px;border:1.5px solid #5d7f84;background:transparent;color:#e6efef}
.quick svg{width:22px;height:22px}.quick:hover{background:var(--ac);border-color:var(--ac)}
.pf .op{margin-inline-start:6px}
.pd .price .op{font-size:18px;margin-inline-start:10px}
@media(max-width:900px){h2#arrivals{gap:14px}.arr .pb{padding:2px 14px 16px}.arr .price{font-size:17px}.quick{width:38px;height:38px}}

/* ===== 3D vape (pod mod) built from shaded CSS 3D strips ===== */
const D3={host:null,parts:[],ptr:{x:0,y:0,tx:0,ty:0}};
(function(){
const clamp=(v,a=0,b=255)=>Math.max(a,Math.min(b,v)),n3=v=>{const m=Math.hypot(...v);return v.map(x=>x/m)};
const L=n3([-.5,.4,.76]),H=n3([L[0],L[1],L[2]+1]),R=n3([.85,.1,-.5]),TL=n3([-.95,0,-.3]);
function strip(p,cls,w,h,y,px,pz,a,sh){const e=document.createElement('i');e.className='s '+cls;e.style.cssText=`width:${w}px;height:${h}px;left:${-w/2}px;top:${y}px;transform:translate3d(${px}px,0,${pz}px) rotateY(${a}rad)`;p.appendChild(e);D3.parts.push({e,a,sh})}
function cyl(p,cls,r,h,y,n,sh){for(let i=0;i<n;i++){const a=2*Math.PI*i/n,ap=r*Math.cos(Math.PI/n);strip(p,cls,2*r*Math.sin(Math.PI/n)+1.4,h,y,ap*Math.sin(a),ap*Math.cos(a),a,sh)}}
function rrect(p,cls,W,Dp,rc,h,y,k,sh){
  strip(p,cls,W-2*rc+1.4,h,y,0,Dp/2,0,sh);strip(p,cls,W-2*rc+1.4,h,y,0,-Dp/2,Math.PI,sh);
  strip(p,cls,Dp-2*rc+1.4,h,y,W/2,0,Math.PI/2,sh);strip(p,cls,Dp-2*rc+1.4,h,y,-W/2,0,-Math.PI/2,sh);
  const ar=rc*Math.cos(Math.PI/(4*k)),w=2*rc*Math.sin(Math.PI/(4*k))+1.4;
  [[1,1,0],[-1,1,-Math.PI/2],[1,-1,Math.PI/2],[-1,-1,Math.PI]].forEach(([sx,sz,a0])=>{const cx=sx*(W/2-rc),cz=sz*(Dp/2-rc);
    for(let i=0;i<k;i++){const a=a0+(i+.5)*(Math.PI/2)/k;strip(p,cls,w,h,y,cx+ar*Math.sin(a),cz+ar*Math.cos(a),a,sh)}})}
const SH={
 body(nx,nz){const d=Math.max(0,nx*L[0]+nz*L[2]),s=Math.pow(Math.max(0,nx*H[0]+nz*H[2]),38),r=Math.pow(Math.max(0,nx*R[0]+nz*R[2]),2.2),t=Math.pow(Math.max(0,nx*TL[0]+nz*TL[2]),3);
  return `rgb(${clamp(9+d*15+s*215+r*18+t*8)|0},${clamp(12+d*17+s*222+r*38+t*95)|0},${clamp(14+d*20+s*226+r*46+t*85)|0})`},
 chrome(nx,nz){const rx=2*nz*nx,rz=2*nz*nz-1,f=Math.atan2(rx,rz),b=Math.pow(.5+.5*Math.cos(2*f+1.3),2),hl=Math.pow(Math.max(0,Math.cos(f-.9)),18),s=Math.pow(Math.max(0,nx*H[0]+nz*H[2]),60),t=Math.pow(Math.max(0,nx*TL[0]+nz*TL[2]),3),v=.2+.5*b+.45*hl+.4*s;
  return `rgb(${clamp(v*215+8)|0},${clamp(v*226+14+t*60)|0},${clamp(v*232+18+t*50)|0})`},
 glass(nx,nz){const fr=Math.pow(1-Math.abs(nz),2.2),s=Math.pow(Math.max(0,nx*H[0]+nz*H[2]),50),t=Math.pow(Math.max(0,nx*TL[0]+nz*TL[2]),3);
  return `rgba(${clamp(190+s*60)|0},${clamp(245+s*10)|0},${clamp(240)|0},${(.05+.42*fr+.55*s+.12*t).toFixed(3)})`},
 liquid(nx,nz){const d=Math.max(0,nx*L[0]+nz*L[2]),c=.4+.75*d,s=Math.pow(Math.max(0,nx*H[0]+nz*H[2]),30);
  return `rgba(${clamp(20*c+s*180)|0},${clamp(215*c+s*80)|0},${clamp(185*c+s*70)|0},.66)`},
 tip(nx,nz){const s=Math.pow(Math.max(0,nx*H[0]+nz*H[2]),30),d=Math.max(0,nx*L[0]+nz*L[2]),t=Math.pow(Math.max(0,nx*TL[0]+nz*TL[2]),3);
  return `rgb(${clamp(10+d*14+s*220)|0},${clamp(12+d*16+s*226+t*50)|0},${clamp(14+d*18+s*230+t*45)|0})`}
};
function build(host){
  D3.parts=[];
  host.innerHTML='<div class="lean"><div class="tglow"></div><div class="puffs"><b></b><b></b><b></b><b></b><b></b><b></b></div><div class="rig"></div><div class="flr"></div></div>';
  const rig=host.querySelector('.rig');
  rrect(rig,'m-body',124,84,24,250,-30,6,'body');                 // main body
  rrect(rig,'m-chrome',112,74,20,16,-46,5,'chrome');               // top plate
  cyl(rig,'m-chrome',54,12,-58,30,'chrome');                       // tank base ring
  cyl(rig,'m-liq',40,74,-146,26,'liquid');                         // e-liquid
  cyl(rig,'m-chrome',12,112,-170,14,'chrome');                     // coil / chimney
  cyl(rig,'m-glass',48,110,-168,34,'glass');                       // glass tank
  cyl(rig,'m-chrome',52,12,-180,30,'chrome');                      // tank top ring
  cyl(rig,'m-tip',34,12,-192,26,'tip');cyl(rig,'m-tip',27,20,-210,24,'tip');cyl(rig,'m-tip',23,12,-222,22,'tip'); // drip tip
  cyl(rig,'m-chrome',30,5,-196,26,'chrome');
  // front details
  const f=document.createElement('div');f.className='front';f.innerHTML='<div class="scr"><b>30<small>W</small></b><span><i></i><i></i><i></i><i></i></span></div><div class="fire"><i></i></div><div class="brand">DRIPHOUSE</div><div class="bar"></div>';rig.appendChild(f);
}
function frame(ts){
  const host=D3.host;if(!host||!host.isConnected){D3.host=null;D3.raf=0;return}
  D3.raf=requestAnimationFrame(frame);
  const rc=host.getBoundingClientRect();if(rc.bottom<0||rc.top>innerHeight)return;
  const t=ts/1000,p=D3.ptr;p.x+=(p.tx-p.x)*.06;p.y+=(p.ty-p.y)*.06;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,th=(reduce?.3:.4*Math.sin(t*.42)+.18)+p.x*.35;
  host.querySelector('.rig').style.transform=`rotateX(${(-.12+p.y*.12).toFixed(3)}rad) rotateY(${th.toFixed(3)}rad)`;
  for(const q of D3.parts){const wa=q.a+th,c=SH[q.sh](Math.sin(wa),Math.cos(wa));if(c!==q.last){q.e.style.backgroundColor=c;q.last=c}}
}
window.mountDev=function(){const host=document.getElementById('d3');if(!host){D3.host=null;return}
  if(D3.host===host)return;D3.host=host;build(host);if(!D3.raf)D3.raf=requestAnimationFrame(frame)};
